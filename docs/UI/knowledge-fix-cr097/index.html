<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>知识库 · CR-097 设计 v1</title>
<link rel="stylesheet" href="../workbench-v4/tokens.css"><link rel="stylesheet" href="../workbench-v4/base.css">
<style>
  html,body{height:100%}
  body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--font)}
  button{font-family:inherit;cursor:pointer}
  /* 评审控制条（仅设计稿） */
  .review{padding:7px 14px;background:var(--warning-soft);color:var(--warning);display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;border-bottom:1px solid var(--line)}
  .review strong{font-size:12px}
  .review select{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:2px 4px;font-size:12px;color:var(--ink)}
  .review .note{color:var(--ink-2);flex:1 1 260px;min-width:200px}
  .review .sw{display:flex;align-items:center;gap:4px;cursor:pointer}
  .top{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
  .top b{font-size:14px}.top .path{font-size:11px;color:var(--muted)}.top .spacer{flex:1}
  .btn{height:28px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:12px;color:var(--ink-2)}
  .btn:hover{background:var(--surface-3)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-strong)}
  .btn.sm{height:26px;padding:0 8px;font-size:11px}
  .btn.danger{color:var(--danger);border-color:var(--line-strong)}
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr) 288px;flex:1;min-height:0}
  /* 左栏 */
  .tree{min-height:0;display:flex;flex-direction:column;background:var(--surface-2);border-right:1px solid var(--line)}
  .side-top{display:flex;gap:6px;padding:10px 10px 8px;flex:none}
  .home{width:32px;height:32px;border:1px solid var(--line-strong);border-right:0;border-radius:6px 0 0 6px;background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:14px}
  .space{flex:1;min-width:0;height:32px;border:1px solid var(--line-strong);border-radius:0 6px 6px 0;background:var(--surface);display:flex;align-items:center;padding:0 8px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .callout{margin:0 10px 8px;padding:8px 10px;border:1px dashed var(--primary-line);background:var(--primary-soft);color:var(--primary-strong);border-radius:6px;font-size:11px;line-height:1.6}
  .search{padding:6px 10px;flex:none}
  .search input{width:100%;height:28px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 8px;font-size:12px;color:var(--ink)}
  .fold-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;color:var(--muted);font-size:11px;flex:none}
  .fold-bar .add{color:var(--muted);font-size:13px;padding:0 4px}
  .tree-list{flex:1;min-height:0;overflow:auto;padding:2px 8px 10px}
  .row{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px;border-radius:5px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
  .row:hover{background:var(--surface-3)}
  .row.folder{color:var(--ink);font-weight:600}
  .row.active{background:var(--primary-soft);color:var(--primary-strong)}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .row .ic{width:14px;text-align:center;flex:none;color:var(--muted)}
  .row .ic.md{color:#0b7d70}.row .ic.pdf{color:#d14343}.row .ic.word{color:#2b5fd9}.row .ic.img{color:#7a5af8}
  .row .more{color:var(--muted-2);font-size:12px;visibility:hidden}
  .row:hover .more{visibility:visible}
  .side-foot{display:flex;border-top:1px solid var(--line);flex:none;background:var(--surface-2)}
  .side-foot button{flex:1;height:34px;background:transparent;border:0;color:var(--muted);font-size:11px}
  .side-foot button:hover{background:var(--surface-3)}
  /* 中栏 */
  .center{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
  .doc-head{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 16px;border-bottom:1px solid var(--line);flex:none}
  .doc-head .t{font-size:18px;color:var(--ink);min-width:0;overflow-wrap:anywhere}
  .doc-head .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .doc-head .spacer{flex:1}
  /* 右上操作组：默认隐藏；悬停/聚焦显示；sim-hover 强制显示；触摸常显 */
  .doc-actions{display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s}
  .doc-head:hover .doc-actions,
  .doc-head:focus-within .doc-actions,
  body.sim-hover .doc-actions{opacity:1;pointer-events:auto}
  @media (hover: none){.doc-actions{opacity:1;pointer-events:auto}}
  .doc-scroll{flex:1;min-height:0;overflow:auto;background:var(--bg)}
  .paper{max-width:820px;margin:0 auto;background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:34px 44px 80px;min-height:100%;line-height:1.85}
  .paper h1{font-size:24px;margin:0 0 6px}
  .paper h2{font-size:17px;margin:26px 0 10px;padding-top:6px;border-top:1px solid var(--line-soft)}
  .paper p{margin:10px 0;font-size:14px;color:var(--ink-2)}
  .paper ul{margin:10px 0;padding-left:22px;font-size:14px;color:var(--ink-2)}
  .paper code{font-family:var(--mono);font-size:12px;background:var(--surface-3);padding:1px 5px;border-radius:4px}
  .paper .meta{font-size:12px;color:var(--muted);margin-bottom:14px}
  .paper table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
  .paper th,.paper td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .paper th{background:var(--surface-2)}
  .inline-img{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);margin:16px 0;cursor:zoom-in;position:relative;max-width:520px}
  .inline-img svg{display:block;width:100%;height:auto}
  .inline-img .hint{position:absolute;right:8px;bottom:8px;background:rgba(17,24,39,.66);color:#fff;font-size:11px;padding:3px 7px;border-radius:5px}
  .spec{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--primary-soft);color:var(--primary-strong);border-bottom:1px solid var(--primary-line);font-size:12px;flex:none}
  .spec b{font-weight:600}
  /* 右栏 */
  .aside{min-height:0;overflow:auto;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
  .tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2);flex:none;overflow-x:auto}
  .tabs button{flex:0 0 auto;padding:9px 10px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;background:transparent;border-top:0;border-left:0;border-right:0}
  .tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);background:var(--surface)}
  .tabs .count{font-size:10px;color:var(--muted);margin-left:3px}
  .aside-body{padding:10px 12px;overflow:auto}
  .toc-item{display:block;width:100%;text-align:left;padding:5px 6px;border-left:2px solid transparent;font-size:11px;color:var(--muted);background:transparent;border-top:0;border-right:0;border-bottom:0}
  .toc-item:hover{color:var(--primary-strong);border-left-color:var(--primary);background:var(--primary-soft)}
  .toc-item.l2{padding-left:16px}
  .nav-page{display:flex;flex-direction:column;gap:3px}
  .nav-page button{text-align:left;padding:8px;border-radius:6px;font-size:12px;color:var(--ink-2);background:transparent;border:0}
  .nav-page button:hover{background:var(--surface-2)}
  .nav-page button[aria-current="true"]{background:var(--primary-soft);color:var(--primary)}
  .info dl{margin:0;font-size:11px}
  .info dt{color:var(--muted);margin-top:8px}.info dd{margin:2px 0 0;color:var(--ink-2);overflow-wrap:anywhere}
  .side-sec{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .side-sec b{font-size:11px;color:var(--ink-2)}
  .side-sec p{font-size:10px;color:var(--muted);line-height:1.7;margin:6px 0}
  /* Office / PDF 预览 */
  .pv-head{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex:none}
  .pv-head h1{font-size:16px;margin:0}
  .pv-head .spacer{flex:1}
  .pv-toolbar{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:12px;color:var(--muted);flex:none}
  .pv-stage{flex:1;min-height:0;overflow:auto;padding:24px;background:var(--bg)}
  .pv-page{width:660px;max-width:100%;min-height:860px;margin:0 auto;background:#fff;color:#1f2329;box-shadow:0 0 0 1px var(--line),0 6px 20px rgba(17,24,39,.08);padding:56px 60px;font-size:13px;line-height:1.9}
  .pv-page h2{font-size:19px;margin:0 0 14px}
  .pv-page p{color:#3a4048;margin:9px 0}
  .state-card{max-width:640px;margin:56px auto;padding:26px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-card)}
  .state-card .k{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--warning);background:var(--warning-soft);border:1px solid var(--line-soft);padding:3px 8px;border-radius:999px}
  .state-card h2{font-size:17px;margin:12px 0 6px}
  .state-card p{font-size:12px;color:var(--ink-2);line-height:1.8;margin:6px 0}
  .state-card ul{font-size:12px;color:var(--ink-2);line-height:1.9;padding-left:18px}
  .state-card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .progress{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin:12px 0}
  .progress i{display:block;height:100%;width:42%;background:var(--primary)}
  .badge-dir{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--surface-3);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
  /* 设置卡片（模型场景） */
  .settings{max-width:760px;margin:0 auto;padding:26px 34px}
  .settings h1{font-size:20px;margin:0 0 4px}
  .settings .lead{font-size:12px;color:var(--muted);margin:0 0 18px}
  .group{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:14px}
  .group h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
  .kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 14px;padding:14px 16px;font-size:12px;align-items:center}
  .kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
  .kv .tag{display:inline-block;font-size:10px;color:var(--success);background:var(--success-soft);border-radius:999px;padding:2px 7px;margin-left:6px}
  .kv .hint{display:block;color:var(--muted);font-size:10px;margin-top:4px}
  /* 图片查看器 */
  .viewer{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.9);display:flex;flex-direction:column;color:#e8eaee}
  .viewer[hidden]{display:none}
  .viewer-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(20,23,28,.92);border-bottom:1px solid rgba(255,255,255,.1);flex:none;font-size:12px}
  .viewer-bar .name{font-weight:600;color:#fff;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewer-bar .pct{font-family:var(--mono);min-width:52px;text-align:center;color:#cfd6e0}
  .viewer-bar .spacer{flex:1}
  .viewer-bar .vbtn{height:28px;min-width:30px;padding:0 9px;border:1px solid rgba(255,255,255,.22);border-radius:6px;background:rgba(255,255,255,.06);color:#e8eaee;font-size:12px}
  .viewer-bar .vbtn:hover{background:rgba(255,255,255,.14)}
  .viewer-bar .vbtn[aria-pressed="true"]{background:#2b6cf6;border-color:#2b6cf6;color:#fff}
  .viewer-bar .close{background:transparent;border:0;color:#cfd6e0;font-size:20px;line-height:1;padding:0 6px}
  .viewer-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;cursor:grab}
  .viewer-stage.dragging{cursor:grabbing}
  .viewer-art{transform:scale(var(--zoom,1));transition:transform .06s;transform-origin:center center;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
  .viewer-foot{padding:7px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#9aa3ae;text-align:center;flex:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 13px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .15s;z-index:80;pointer-events:none}
  .toast.show{opacity:1}
  @media(max-width:1080px){.shell{grid-template-columns:minmax(0,1fr) 268px}.tree{display:none}}
  @media(max-width:760px){.shell{grid-template-columns:minmax(0,1fr)}.aside{display:none}.paper{padding:22px 18px 60px}.doc-head{padding:6px 12px;flex-wrap:wrap}.review{gap:8px}}
</style>
<script defer src="../workbench-v4/scrollbar.js"></script>
</head>
<body data-design-version="UI-CR097-v1">
<div class="review">
  <strong>CR-097 · 设计 v1 · 未实现</strong>
  <label>场景 <select id="sceneSel" aria-label="评审场景">
    <option value="upload">SC-097-01 左栏顶部无上传按钮</option>
    <option value="office">SC-097-02 Office / PDF 预览状态</option>
    <option value="image">SC-097-03 图片查看器（缩放 / 平移）</option>
    <option value="md">SC-097-04 Markdown 阅读页（操作组 / 滚动）</option>
    <option value="model">SC-097-05 语义模型目录位置</option>
  </select></label>
  <label id="officeWrap">预览状态 <select id="officeSel" aria-label="预览状态">
    <option value="missing">组件缺失（Word/PPT/Excel）</option>
    <option value="converting">转换中</option>
    <option value="ready">预览就绪 / PDF 直接预览</option>
  </select></label>
  <label class="sw"><input type="checkbox" id="hoverChk"> 模拟悬停（操作组浮现）</label>
  <span class="note" id="sceneNote"></span>
</div>
<header class="top">
  <b>知识库 · NestCraft 产品资料库</b><span class="path">本地文件夹</span><span class="spacer"></span>
  <span class="path">UI-CR097-v1</span>
  <button class="btn" id="themeBtn">深色</button>
</header>
<div class="shell">
  <aside class="tree" id="tree" aria-label="知识文件树"></aside>
  <main class="center" id="center" aria-label="正文阅读区"></main>
  <aside class="aside" id="aside" aria-label="目录与文件信息"></aside>
</div>

<div class="viewer" id="viewer" hidden aria-label="图片查看器">
  <div class="viewer-bar">
    <span class="name" id="vName">架构图.png</span>
    <span class="pct" id="vPct">100%</span>
    <button class="vbtn" id="vOut" aria-label="缩小">−</button>
    <button class="vbtn" id="vIn" aria-label="放大">＋</button>
    <button class="vbtn" id="vFit" aria-pressed="true">适应窗口</button>
    <button class="vbtn" id="v100" aria-pressed="false">100%</button>
    <span class="spacer"></span>
    <button class="close" id="vClose" aria-label="关闭查看器">×</button>
  </div>
  <div class="viewer-stage" id="vStage">
    <svg class="viewer-art" id="vArt" width="760" height="500" viewBox="0 0 760 500" role="img" aria-label="示例架构图">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1ff"/><stop offset="1" stop-color="#dce8ff"/></linearGradient>
      </defs>
      <rect x="0" y="0" width="760" height="500" rx="12" fill="#ffffff"/>
      <text x="32" y="52" font-family="Segoe UI,Microsoft YaHei" font-size="22" font-weight="700" fill="#1f2329">知识库阅读链路</text>
      <text x="32" y="78" font-family="Segoe UI,Microsoft YaHei" font-size="12" fill="#86909c">示例图片 · 仅用于演示缩放与平移</text>
      <g font-family="Segoe UI,Microsoft YaHei" font-size="13" fill="#1f2329">
        <rect x="36" y="120" width="150" height="76" rx="10" fill="url(#g1)" stroke="#c9dafd"/><text x="66" y="164">文件树 / 目录</text>
        <rect x="228" y="120" width="150" height="76" rx="10" fill="url(#g1)" stroke="#c9dafd"/><text x="270" y="164">格式分流</text>
        <rect x="420" y="120" width="150" height="76" rx="10" fill="url(#g1)" stroke="#c9dafd"/><text x="458" y="164">阅读 / 查看器</text>
        <rect x="228" y="286" width="150" height="76" rx="10" fill="#fff6e6" stroke="#f0d8a8"/><text x="252" y="330">Office 转换组件</text>
        <rect x="420" y="286" width="150" height="76" rx="10" fill="#e9f8ef" stroke="#bfe6cf"/><text x="462" y="330">PDF 直接预览</text>
      </g>
      <g stroke="#9aa3ae" stroke-width="2" fill="none" marker-end="url(#a)">
        <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9aa3ae"/></marker></defs>
        <path d="M186 158 H228"/><path d="M378 158 H420"/><path d="M303 196 V286"/><path d="M378 324 H420"/>
      </g>
    </svg>
  </div>
  <div class="viewer-foot">滚轮缩放 · 拖拽平移 · Esc 关闭 · 不修改原文件</div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const SCENES = {
    upload: { note: 'SC-097-01：左栏顶部不再有独立「上传」按钮；上传入口保留在目录 + 菜单与拖拽，能力不减。' },
    office: { note: 'SC-097-02：PDF 直接预览；Word/PPT/Excel 缺组件时给出可理解状态卡与准备/下载/重试动作。' },
    image:  { note: 'SC-097-03：点击图片进入查看器，可适应窗口、100%、加减与滚轮缩放、拖拽平移，Esc 关闭回焦原图。' },
    md:     { note: 'SC-097-04：右上「编辑/更多」默认隐藏、悬停或聚焦浮现；长文可纵向滚动到底，滚动条按需显示（模拟悬停可预览操作组）。' },
    model:  { note: 'SC-097-05：本地语义模型位于统一数据根下 semantic-model，界面显示实际目录。' }
  };
  let scene = SCENES[q.get('scene')] ? q.get('scene') : 'upload';
  let officeState = ['missing','converting','ready'].includes(q.get('office')) ? q.get('office') : 'missing';
  let hoverSim = q.get('hover') !== '0' ? false : false;
  if (q.get('hover') === '1') hoverSim = true;
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

  const files = [
    { id:'f1', name:'产品定位.md', ic:'md', active:true },
    { id:'f2', name:'路线图.md', ic:'md' },
    { id:'f3', name:'需求说明.docx', ic:'word' },
    { id:'f4', name:'产品使用手册.pdf', ic:'pdf' },
    { id:'f5', name:'架构图.png', ic:'img' },
    { id:'f6', name:'竞品分析.md', ic:'md' },
    { id:'f7', name:'周报.md', ic:'md' }
  ];
  const treeHTML = () => {
    const callout = scene === 'upload'
      ? '<div class="callout">顶部「上传」按钮已移除。上传仍在「目录 + 菜单 → 上传」与拖拽，不减少功能。</div>'
      : '';
    return `
      <div class="side-top"><div class="home" title="返回首页">⌂</div><div class="space">知识库 · NestCraft 产品资料库</div></div>
      ${callout}
      <div class="search"><input placeholder="搜索已索引文件或正文" aria-label="搜索已索引文件或正文"></div>
      <div class="fold-bar"><span>空间目录</span><span class="add" title="新建 / 上传">＋</span></div>
      <div class="tree-list">
        <div class="row folder"><span class="ic">▾</span><span class="nm">01-产品</span><span class="more">＋</span></div>
        ${files.map(f => `<div class="row ${f.active?'active':''}" style="padding-left:18px"><span class="ic ${f.ic}">${f.ic==='md'?'▤':f.ic==='pdf'?'▥':f.ic==='word'?'▦':'▧'}</span><span class="nm">${f.name}</span><span class="more">…</span></div>`).join('')}
        <div class="row folder" style="margin-top:4px"><span class="ic">▸</span><span class="nm">02-研究</span><span class="more">＋</span></div>
      </div>
      <div class="side-foot"><button>⚙ 设置</button><button>🗑 回收站</button></div>`;
  };

  const longMarkdown = () => {
    const secs = [
      ['一、目标与范围','知识库用于沉淀产品资料、研究记录与交付文档。阅读页需要在同一屏内快速定位、连续滚动，并允许在需要时进入编辑。'],
      ['二、信息架构','左侧是文件树，中间是正文，右侧是当前文档的大纲、反向链接与未解析链接。三栏宽度可拖动调整，窄屏时左右栏折叠为抽屉。'],
      ['三、Markdown 阅读','正文按标准 Markdown 渲染，保留标题层级、代码块、表格与引用。超长文档应能完整滚动到末尾，不能只显示第一屏。'],
      ['四、编辑与草稿','进入编辑后保留草稿与光标位置；保存才写入原件。滚动正文不应导致草稿丢失或选区跳变。'],
      ['五、图片与附件','正文图片支持点击打开查看器，可缩放、平移；附件按上传目录存放，不自动创建额外资源目录。'],
      ['六、格式与预览','PDF 直接预览；Word、PPT、Excel 需要本机受管转换组件；组件缺失时给出可理解的状态与出路，不伪造正文。'],
      ['七、搜索与定位','搜索命中可定位到实际文件与标题；索引检索与目录盘点是两件事，状态要分别展示。'],
      ['八、权限与安全','AI 只读授权与本人资料管理分离；正文不自动加载外链资源，不执行脚本与宏。'],
      ['九、性能边界','大文件按预算降级为原文分段阅读，并明确覆盖范围；不得把前缀当作全文。'],
      ['十、验收要点','每个关键状态都要有可见反馈；失败不残留旧内容；滚动条按需显示，不改变正文宽度。']
    ];
    return secs.map(([h,p]) => `<h2>${h}</h2><p>${p}</p><p>${p} 这一节用于演示长文档滚动，重复段落仅作为设计稿样例，不对应真实业务内容。</p>`).join('');
  };

  const mdCenter = () => `
    <div class="doc-head">
      <div><div class="t">产品定位</div><div class="sub">01-产品/产品定位.md · 最近修改：2026-11-25 16:20</div></div>
      <span class="spacer"></span>
      <div class="doc-actions">
        <button class="btn sm">编辑文档</button>
        <button class="btn sm">更多</button>
      </div>
    </div>
    ${scene==='md' ? '<div class="spec"><b>SC-097-04</b><span>右上操作组默认隐藏（opacity:0，不可聚焦）；悬停正文区或键盘聚焦时浮现；触摸设备常显。正文区可纵向滚动至文末。</span></div>' : ''}
    <div class="doc-scroll" id="docScroll" tabindex="0">
      <article class="paper">
        <h1>产品定位</h1>
        <div class="meta">版本 v1 · 负责人：产品组 · 本地文件夹</div>
        <p>本页演示知识库的 Markdown 阅读体验。正文较长以便验证滚动；右上角的操作组在正常情况下不遮挡阅读。</p>
        ${scene==='image' ? '<div class="inline-img" id="inlineImg" title="点击打开查看器"><svg width="520" height="330" viewBox="0 0 520 330" role="img" aria-label="架构图缩略图"><rect width="520" height="330" rx="10" fill="#eef3ff"/><g font-family="Segoe UI,Microsoft YaHei" font-size="12" fill="#1f2329"><rect x="28" y="40" width="130" height="60" rx="8" fill="#fff" stroke="#c9dafd"/><text x="58" y="75">文件树</text><rect x="194" y="40" width="130" height="60" rx="8" fill="#fff" stroke="#c9dafd"/><text x="228" y="75">格式分流</text><rect x="360" y="40" width="130" height="60" rx="8" fill="#fff" stroke="#c9dafd"/><text x="392" y="75">查看器</text><rect x="194" y="180" width="130" height="60" rx="8" fill="#fff6e6" stroke="#f0d8a8"/><text x="224" y="215">Office 组件</text><rect x="360" y="180" width="130" height="60" rx="8" fill="#e9f8ef" stroke="#bfe6cf"/><text x="396" y="215">PDF 预览</text></g><g stroke="#9aa3ae" stroke-width="2" fill="none"><path d="M158 70 H194"/><path d="M324 70 H360"/><path d="M259 100 V180"/><path d="M324 210 H360"/></g></svg><span class="hint">点击查看 · 可缩放</span></div>' : ''}
        ${longMarkdown()}
      </article>
    </div>`;

  const officeCenter = () => {
    const isPdf = officeState === 'ready' && q.get('pdf') === '1';
    if (officeState === 'missing') {
      return `<div class="spec"><b>SC-097-02 · 组件缺失</b><span>Word/PPT/Excel 需要本机受管转换组件；不再只有一行错误码，给出准备组件、下载原件与重试。</span></div>
      <div class="pv-head"><h1>需求说明.docx</h1><span class="path" style="font-size:11px;color:var(--muted)">01-产品/需求说明.docx · Word 文档</span><span class="spacer"></span><button class="btn sm">下载原件</button></div>
      <div class="pv-stage" style="display:flex;align-items:flex-start">
        <div class="state-card">
          <span class="k">◔ 需要本机转换组件</span>
          <h2>暂时无法在库内预览这个 Office 文件</h2>
          <p>该格式只读预览需要本机受管的文档转换组件（LibreOffice）。当前未检测到可用组件，因此没有伪造正文预览。</p>
          <ul>
            <li>PDF 可以直接预览，不需要此组件。</li>
            <li>准备组件后可在本页重试，或先下载原件查看。</li>
            <li>转换在私有临时目录进行，不执行宏、不加载外链。</li>
          </ul>
          <div class="row"><button class="btn primary">准备组件</button><button class="btn">重试</button><button class="btn">下载原件</button></div>
          <p style="font-size:11px;color:var(--muted);margin-top:14px">组件准备方式待确认（本机检测 / 首次下载 / 随部署放置），见 CR-097 D2。</p>
        </div>
      </div>`;
    }
    if (officeState === 'converting') {
      return `<div class="spec"><b>SC-097-02 · 转换中</b><span>显示真实进度与取消入口；不虚构页数。</span></div>
      <div class="pv-head"><h1>产品介绍.pptx</h1><span class="path" style="font-size:11px;color:var(--muted)">01-产品/产品介绍.pptx · 演示文稿</span><span class="spacer"></span><button class="btn sm">取消转换</button></div>
      <div class="pv-stage" style="display:flex;align-items:flex-start">
        <div class="state-card">
          <span class="k">◔ 正在转换</span>
          <h2>正在为本机预览准备 PDF</h2>
          <div class="progress"><i></i></div>
          <p>已用时 6 秒 · 转换完成后自动打开只读预览，可取消。</p>
          <div class="row"><button class="btn">取消转换</button><button class="btn">下载原件</button></div>
        </div>
      </div>`;
    }
    const title = isPdf ? '产品使用手册.pdf' : '需求说明.docx';
    const sub = isPdf ? 'PDF 直接预览 · 无需转换组件' : 'Word 文档 · 已由本机组件转换为 PDF';
    return `<div class="spec"><b>SC-097-02 · 预览就绪</b><span>${isPdf ? 'PDF 不经转换组件，打开即预览。' : '转换组件就绪后只读分页预览，显示实际页数。'}</span></div>
    <div class="pv-head"><h1>${title}</h1><span class="path" style="font-size:11px;color:var(--muted)">01-产品/${title} · ${sub}</span><span class="spacer"></span><button class="btn sm">下载原件</button></div>
    <div class="pv-toolbar"><span>第 1 / 12 页</span><span>·</span><span>适合宽度</span><span class="spacer"></span><span>只读</span></div>
    <div class="pv-stage">
      <div class="pv-page">
        <h2>${isPdf ? '产品使用手册' : '需求说明'}</h2>
        <p>这是只读预览的示例页面，用于展示分页与排版占位。真实预览由 PDF 渲染给出实际内容与页数，不在此伪造。</p>
        <p>目录：一、安装与准备；二、知识库导入；三、阅读与检索；四、权限与安全；五、常见问题。</p>
        <p>页面可在右侧“页面导航”中逐页跳转；顶部显示实际页数，页数未取得时显示未知而不填 0。</p>
        <table><tr><th>项目</th><th>说明</th></tr><tr><td>格式</td><td>${isPdf?'PDF':'DOCX（转换为 PDF 预览）'}</td></tr><tr><td>只读</td><td>是</td></tr></table>
      </div>
    </div>`;
  };

  const imageCenter = () => mdCenter();

  const modelCenter = () => `
    <div class="spec"><b>SC-097-05</b><span>本地语义模型改到统一数据根下 semantic-model；旧位置启动时幂等迁移。本场景展示设置→数据与存储与知识库侧状态的一致性。</span></div>
    <div class="doc-scroll"><div class="settings">
      <h1>设置 · 数据与存储</h1>
      <p class="lead">所有持久数据统一放在数据根下，按类别分目录；换位置需重启生效。</p>
      <div class="group">
        <h3>数据根</h3>
        <dl class="kv">
          <dt>当前数据根</dt><dd><span class="badge-dir">D:\\NestCraft\\data</span><span class="tag">已生效</span><span class="hint">数据库、知识库、索引、日志、生成图片等都在此目录下分类存放。</span></dd>
          <dt>修改位置</dt><dd><button class="btn sm">选择目录…</button><span class="hint">修改后重启应用生效，旧数据幂等迁入，不覆盖已有文件。</span></dd>
        </dl>
      </div>
      <div class="group">
        <h3>本地语义模型</h3>
        <dl class="kv">
          <dt>模型目录</dt><dd><span class="badge-dir">D:\\NestCraft\\data\\semantic-model</span><span class="tag">已就绪</span><span class="hint">bge-small-zh-v1.5 · int8 · 512 维；与数据根同盘，不再放在应用数据目录。</span></dd>
          <dt>迁移记录</dt><dd>检测到旧位置 %APPDATA%\\…\\semantic-model，启动时已逐文件补齐到数据根，未覆盖完整文件。<span class="hint">迁移幂等，可重复执行。</span></dd>
        </dl>
      </div>
      <div class="group">
        <h3>知识库侧显示</h3>
        <dl class="kv"><dt>本地语义模型</dt><dd>已就绪 · 模型目录：<span class="badge-dir">D:\\NestCraft\\data\\semantic-model</span><span class="hint">新建或保存的笔记自动更新向量；缺失时检索回落关键词。</span></dd></dl>
      </div>
    </div></div>`;

  const asideHTML = () => {
    if (scene === 'office') {
      const pages = officeState === 'ready' ? 12 : 0;
      return `<div class="tabs"><button aria-selected="true">页面导航</button></div><div class="aside-body"><div class="nav-page">${pages ? Array.from({length:pages},(_,i)=>`<button aria-current="${i===0}">第 ${i+1} 页</button>`).join('') : '<p style="font-size:11px;color:var(--muted);line-height:1.7">预览就绪后显示实际页数；不虚构页数。</p>'}</div></div>`;
    }
    if (scene === 'model') {
      return `<div class="tabs"><button aria-selected="true">文件信息</button></div><div class="aside-body info"><dl><dt>类型</dt><dd>设置</dd><dt>位置</dt><dd>数据与存储</dd><dt>影响</dt><dd>仅存储位置与迁移；不改变检索行为</dd></dl><div class="side-sec"><b>相关</b><p>语义模型缺失时检索回落关键词，界面标注，不冒充语义。</p></div></div>`;
    }
    return `<div class="tabs" role="tablist"><button role="tab" aria-selected="true">大纲</button><button role="tab" aria-selected="false">反向链接 <span class="count">3</span></button><button role="tab" aria-selected="false">未解析 <span class="count">2</span></button></div>
      <div class="aside-body">
        <button class="toc-item">一、目标与范围</button><button class="toc-item">二、信息架构</button><button class="toc-item">三、Markdown 阅读</button><button class="toc-item l2">3.1 长文滚动</button><button class="toc-item l2">3.2 操作组</button><button class="toc-item">四、编辑与草稿</button><button class="toc-item">五、图片与附件</button><button class="toc-item">六、格式与预览</button><button class="toc-item">七、搜索与定位</button>
        <div class="side-sec"><b>本人资料管理</b><p>AI 授权只控制只读检索，不授予写入或执行。</p><button class="btn sm" style="width:100%;margin-top:6px">AI 授权管理</button></div>
        ${scene==='model' ? '' : '<div class="side-sec"><b>本地语义模型</b><p>已就绪 · 模型目录：D:\\NestCraft\\data\\semantic-model</p></div>'}
      </div>`;
  };

  const applyNote = () => {
    $('sceneNote').textContent = SCENES[scene].note;
    $('sceneSel').value = scene;
    $('officeSel').value = officeState;
    $('officeWrap').style.display = scene === 'office' ? '' : 'none';
    $('hoverChk').checked = hoverSim;
    document.body.classList.toggle('sim-hover', hoverSim);
  };

  const render = () => {
    $('tree').innerHTML = treeHTML();
    $('center').innerHTML = scene === 'office' ? officeCenter()
      : scene === 'model' ? modelCenter()
      : scene === 'image' ? imageCenter()
      : mdCenter();
    $('aside').innerHTML = asideHTML();
    applyNote();
    const viewer = $('viewer');
    if (scene === 'image') { viewer.hidden = false; }
    else { viewer.hidden = true; }
  };

  // 场景/状态/主题/悬停切换
  $('sceneSel').addEventListener('change', e => { scene = e.target.value; render(); });
  $('officeSel').addEventListener('change', e => { officeState = e.target.value; render(); });
  $('hoverChk').addEventListener('change', e => { hoverSim = e.target.checked; document.body.classList.toggle('sim-hover', hoverSim); });
  $('themeBtn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('themeBtn').textContent = dark ? '浅色' : '深色';
  });

  // 图片查看器交互
  const vArt = $('vArt'), vStage = $('vStage'), vPct = $('vPct');
  let zoom = 1, panX = 0, panY = 0, drag = null;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const applyZoom = () => {
    zoom = clamp(zoom, 0.1, 8);
    vPct.textContent = Math.round(zoom * 100) + '%';
    vArt.style.setProperty('--zoom', zoom);
    vArt.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    $('vFit').setAttribute('aria-pressed', zoom === 1 && panX === 0 && panY === 0 ? 'true' : 'false');
    $('v100').setAttribute('aria-pressed', zoom === 1 ? 'true' : 'false');
  };
  $('vIn').addEventListener('click', () => { zoom *= 1.1; applyZoom(); });
  $('vOut').addEventListener('click', () => { zoom /= 1.1; applyZoom(); });
  $('vFit').addEventListener('click', () => { zoom = 1; panX = panY = 0; applyZoom(); });
  $('v100').addEventListener('click', () => { zoom = 1; panX = panY = 0; applyZoom(); });
  $('vClose').addEventListener('click', () => { $('viewer').hidden = true; });
  vStage.addEventListener('wheel', e => { e.preventDefault(); zoom *= e.deltaY < 0 ? 1.1 : 1 / 1.1; applyZoom(); }, { passive: false });
  vStage.addEventListener('pointerdown', e => { drag = { x: e.clientX - panX, y: e.clientY - panY }; vStage.classList.add('dragging'); vStage.setPointerCapture(e.pointerId); });
  vStage.addEventListener('pointermove', e => { if (!drag) return; panX = e.clientX - drag.x; panY = e.clientY - drag.y; applyZoom(); });
  vStage.addEventListener('pointerup', () => { drag = null; vStage.classList.remove('dragging'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('viewer').hidden) $('viewer').hidden = true; });

  render();
  // 设计稿自检标记，供截图脚本断言
  window.__cr097 = { scene, officeState, hasTopUpload: !!document.querySelector('.kw-create-actions,.top-upload'), viewerOpen: !$('viewer').hidden, docScrollable: () => { const el = document.getElementById('docScroll'); return el ? el.scrollHeight > el.clientHeight + 4 : false; } };
})();
</script>
</body>
</html>
