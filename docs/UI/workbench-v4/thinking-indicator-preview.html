<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 运行态 Logo 预览（canvas 粒子）</title>
<style>
:root{--bg:#eef2f7;--paper:#fff;--line:#e1e7ef;--ink:#243044;--muted:#7b8799}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:40px}
.preview{width:min(920px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:34px 40px;box-shadow:0 18px 60px #19375d14}
h1{font-size:17px;margin:0 0 6px}p.sub{margin:0 0 26px;color:var(--muted);font-size:12.5px}
.states{display:grid;gap:14px}
.state{border:1px solid var(--line);border-radius:12px;padding:16px 20px;background:var(--paper)}
.state-label{font-size:10.5px;color:var(--muted);margin-bottom:8px}
.chat-working{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:var(--muted);font-size:11.5px}
.chat-working-logo{position:relative;width:44px;height:44px;display:inline-grid;place-items:center;flex:0 0 auto}
.chat-working-canvas{display:block;width:44px;height:44px}
.chat-working-label{color:var(--ink);font-weight:550;letter-spacing:.01em}
.chat-working-duration{color:var(--muted);font-variant-numeric:tabular-nums}
.dark{--bg:#0d1219;--paper:#18202b;--line:#2c3949;--ink:#e7edf7;--muted:#9aa8ba}
.dark .preview{box-shadow:0 18px 60px #0008}
.gif-demo{margin:0 0 22px;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.gif-demo img{display:block;flex:0 0 auto;image-rendering:auto}
.gif-demo figcaption{color:var(--muted);font-size:11.5px;line-height:1.6}
</style>
</head>
<body>
<script>if(location.search.indexOf('dark')>=0||location.hash.indexOf('dark')>=0){document.documentElement.classList.add('dark');document.body.classList.add('dark')}</script>
<main class="preview" aria-label="AI 运行态 Logo 预览">
  <h1>AI 运行态 · logo 打散重组</h1>
  <p class="sub">粒子取自 logo 自身像素：聚合 → 整体打散 → 旋转 → 重组；后面显示工作状态与运行时长。</p>
  <figure class="gif-demo"><img src="thinking-logo-particles.gif" alt="logo 打散成粒子后旋转重组的循环动画" width="150" height="150"><figcaption>单独动效（透明背景 · 无限循环）· 参数与侧栏实现一致</figcaption></figure>
  <div class="states" id="states"></div>
</main>
<script>
const LOGO='../../../public/brand/logo-sail.png';
const SIZE=44,SCALE=3,CYCLE=2800;
function smooth(x){const v=Math.min(1,Math.max(0,x));return v*v*(3-2*v)}
function scatterAt(u){if(u<0.1)return 0;if(u<0.34)return smooth((u-0.1)/0.24);if(u<0.5)return 1;if(u<0.84)return 1-smooth((u-0.5)/0.34);return 0}
function buildParticles(sizePx){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const off=document.createElement('canvas');off.width=sizePx;off.height=sizePx;
      const ctx=off.getContext('2d',{willReadFrequently:true});
      const logoSize=sizePx*0.56;
      ctx.drawImage(img,(sizePx-logoSize)/2,(sizePx-logoSize)/2,logoSize,logoSize);
      const d=ctx.getImageData(0,0,sizePx,sizePx);
      const cx=sizePx/2,cy=sizePx/2,list=[];
      for(let y=0;y<sizePx;y++)for(let x=0;x<sizePx;x++){
        const i=(y*sizePx+x)*4;
        if(d.data[i+3]<110)continue;
        const angle=Math.atan2(y-cy,x-cx)+(Math.random()-0.5)*1.1;
        const radius=sizePx*(0.13+Math.random()*0.35);
        list.push({x0:x,y0:y,x1:cx+Math.cos(angle)*radius,y1:cy+Math.sin(angle)*radius,color:`rgb(${d.data[i]},${d.data[i+1]},${d.data[i+2]})`,size:Math.random()<0.3?1.5:1});
      }
      resolve(list);
    };
    img.src=LOGO;
  });
}
const CASES=[['刚开始',0,'0 秒'],['持续运行',0.28,'12 秒'],['旋转中',0.42,'48 秒'],['重组中',0.75,'2 分 06 秒'],['长时间运行',0,'1 时 04 分 08 秒']];
(async()=>{
  const px=SIZE*SCALE;
  const particles=await buildParticles(px);
  const host=document.getElementById('states');
  for(const [label,u,duration] of CASES){
    const section=document.createElement('section');section.className='state';
    const cap=document.createElement('div');cap.className='state-label';cap.textContent=label;
    const row=document.createElement('div');row.className='chat-working';
    const logoWrap=document.createElement('span');logoWrap.className='chat-working-logo';
    const canvas=document.createElement('canvas');canvas.className='chat-working-canvas';
    canvas.width=px;canvas.height=px;canvas.style.width=SIZE+'px';canvas.style.height=SIZE+'px';
    const ctx=canvas.getContext('2d');
    const cx=px/2,cy=px/2;
    const s=scatterAt(u),rot=Math.PI*2*1.25*Math.pow(u,0.92),cos=Math.cos(rot),sin=Math.sin(rot);
    ctx.clearRect(0,0,px,px);
    ctx.globalAlpha=0.68+0.32*Math.pow(1-s,0.7);
    for(const p of particles){
      const tx=cx+cos*(p.x1-cx)-sin*(p.y1-cy),ty=cy+sin*(p.x1-cx)+cos*(p.y1-cy);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x0+(tx-p.x0)*s,p.y0+(ty-p.y0)*s,p.size,p.size);
    }
    const name=document.createElement('span');name.className='chat-working-label';name.textContent='工作中…';
    const dur=document.createElement('span');dur.className='chat-working-duration';dur.textContent=duration;
    logoWrap.appendChild(canvas);row.append(logoWrap,name,dur);
    section.append(cap,row);host.appendChild(section);
  }
  document.title='ready';
})();
</script>
</body>
</html>
