function knowledgeTool(sessionId,name,input={}){
 const c=sessionById(sessionId), denied=()=>({ok:false,simulation:true,error:'不可访问或参数无效'});

  if(!item||typeof item!=='object'||Array.isArray(item)||Object.hasOwn(item,'projectId'))return denied();
  const {libraryId,noteId,range}=item;

  if(range){start=Number(range.start);end=Number(range.end);if(!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start||start>lines.length)return denied();}
  return {ok:true,simulation:true,libraryId,noteId,title:note.title,path:note.path,version:note.version,text:lines.slice(start-1,end).join('\n'),citation:{libraryId,noteId,version:note.version},links:note.links.map(noteId=>({libraryId,noteId}))};
 };
 if(name==='knowledge.list')return {ok:true,simulation:true,items:libs.slice(cursor,cursor+limit).map(l=>({libraryId:l.id,title:l.name,version:'sample-v1'})),nextCursor:cursor+limit<libs.length?cursor+limit:null};
 if(name==='knowledge.read')return read(input);

  if(typeof input.query!=='string'||!input.query.trim())return denied();

 }

}

function runOffice(key,p,text){

 const lines=f.name.endsWith('.xlsx')?[`四条年度报价：${sheetData.slice(1).map(r=>`${r[0]} ${r[1]}`).join('、')}`,'竞品 B 的报价来源待复核。']:(f.slides??[f.text]).flatMap(s=>s.split('\n')).map(s=>s.trim().replace(/^#+\s*/, '')).filter(Boolean).slice(0,6);
 if(!lines.length){addMessage(key,'所选资料没有可解读的样例内容。','未执行');return true;}
 if(text.includes('生成')||text.includes('制作')){
  const ppt=/ppt|演示|幻灯片/i.test(text), word=/word|报告|文档/i.test(text);
  if(!ppt&&!word){addMessage(key,'请选择生成 PPT 或生成 Word。','未生成提案');return true;}
  if(!toolOn('fs.write')){addMessage(key,'写入工具已停用。','未生成提案');return true;}
  const title=`${f.name.replace(/\.[^.]+$/,'')} · ${ppt?'汇报演示':'解读报告'}`;
  const contents=`${title}\n来源：${f.name}\n\n内容要点\n${lines.map(line=>`• ${line}`).join('\n')}`;
  const slides=ppt?[`${title}\n来源：${f.name}`,`内容要点\n${lines.slice(0,3).join('\n')}`,...(lines.length>3?[`补充要点\n${lines.slice(3).join('\n')}`]:[])]:null;
  chatFor(key).pending={kind:'office',source:f.name,title,ext:ppt?'pptx':'docx',text:contents,slides,summary:`以 ${f.name} 为来源，新建 ${ppt?'PPT':'Word'} 产物。`,delta:slides?slides.map((s,i)=>`${i+1}. ${s}`).join('\n\n'):contents};
 }else if(/解读|总结|摘要|读取/.test(text))addMessage(key,`来源：${f.name}${f.source?`（源自 ${f.source}）`:''}`,'文档解读 · 仿真',lines.map(line=>`• ${line}`).join('\n'));
 else addMessage(key,'请选择解读当前资料、生成 PPT 或生成 Word。','未执行');
 return true;
}

 approve:b=>{const key=b.dataset.key,c=chatFor(key),a=c.pending;if(!a)return;
  const invalid=proposalReason(c,a);if(invalid){cancelPending(key,invalid);repaint(b);return;}
  if(a.kind==='server'){const s=getServer(key.split(':')[1]),why=access(s);if(why)cancelPending(key,why);else{c.pending=null;state.tools.find(t=>t.id==='ssh-exec').count++;addMessage(key,'网关服务已模拟重启。','仿真执行成功');s.output=`${s.output}\n\n[仿真] 网关服务已重启。`;}}
  else if(a.kind==='development'){
    const p=getProject(key.split(':')[1]), item=p.stories.find(x=>x.id===a.story), f=p.files.find(f=>f.name===a.file);
    if(!item||item.status!==4||item.goal!==a.goal||item.ac.map(v=>v.text).join('；')!==a.criteria||!f||f.text!==a.previous||p.edit===a.file||!toolOn('fs.read')||!toolOn('fs.write'))cancelPending(key,'需求、文件或工具状态已变化，请重新发起。');
    else{c.pending=null;f.text=a.next;markGitChange(p,f.name,a.previous);item.file=f.name;item.logs.push(`${when()} · 接受 AI 开发提案：${f.name}`);addMessage(key,`${a.story} 已关联 ${f.name}，请进入验证核对验收项。`,'仿真开发变更已应用');}
   }else if(a.kind==='office'){
    const p=getProject(key.split(':')[1]);
    if(!toolOn('fs.read')||!toolOn('fs.write')||!p.files.some(f=>f.name===a.source&&f.text===a.sourceText))cancelPending(key,'来源已变化或读写工具不可用，请重新发起。');
    else{let name=`${a.title}.${a.ext}`, n=2;while(p.files.some(f=>f.name===name))name=`${a.title} (${n++}).${a.ext}`;c.pending=null;p.files.push({name,text:a.text,slides:a.slides,source:a.source});markGitChange(p,name,'');p.file=name;addMessage(key,`已加入办公产物：${name}。`,'预览已生成');}
   }else{const p=getProject(key.split(':')[1]),f=p.files.find(f=>f.name===a.file);if(!toolOn('fs.write')||!f||(a.slide?f.extra:f.text)!==a.previous||p.edit===a.file)cancelPending(key,'目标已修改、正在编辑或写入工具已停用，请重新发起。');else{c.pending=null;if(a.slide)f.extra=a.change;else f.text+=`\n\n${a.change}`;markGitChange(p,f.name,a.previous);state.tools.find(t=>t.id==='fs.write').count++;addMessage(key,`已更新 ${f.name} 的样例内容。`,'仿真写入成功');}}
  repaint(b);},
