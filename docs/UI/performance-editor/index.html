<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编码性能状态设计 · FEAT-007</title><style>
:root{color-scheme:light;--paper:#fff;--panel:#fafbfc;--line:#e6e8eb;--ink:#1f2329;--muted:#86909c;--accent:#2b6cf6;--soft:#eef3ff;--thumb:#a4abb5;--danger:#d93b3b}html[data-theme=dark]{color-scheme:dark;--paper:#1e2126;--panel:#23262c;--line:#32373f;--ink:#e8eaee;--muted:#9aa3ae;--accent:#5b8dff;--soft:#1e2a44;--thumb:#7d8794;--danger:#ff7b76}*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:transparent transparent}*.scrollbar-active{scrollbar-color:var(--thumb) transparent}body{margin:0;color:var(--ink);background:var(--paper);font:13px "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button{background:transparent;border:1px solid var(--line);border-radius:5px;padding:4px 8px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.lab{height:48px;background:var(--panel);display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.lab small{color:var(--muted)}.workspace{height:calc(100dvh - 48px);display:flex;min-height:0}.tree-pane{width:260px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative;min-height:0}.tree-head,.editor-bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);flex-shrink:0}.spacer{flex:1}.tree{overflow:auto;flex:1;padding:2px 6px;position:relative}.row{height:26px;width:100%;border:0;border-radius:5px;display:flex;gap:7px;align-items:center;padding:0 8px;white-space:nowrap;text-align:left}.row.active{background:var(--soft);color:var(--accent)}.row svg{width:14px;height:14px;flex-shrink:0}.label{overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted)}.main{flex:1;min-width:0;display:flex;flex-direction:column}.tabs{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}.tab{font-size:12px;border:0;color:var(--accent)}.status{font-size:11px;white-space:nowrap}.editor-bar .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;font:11px Consolas,monospace}.editor-stage{flex:1;min-height:0;position:relative;display:flex}.gutter{width:48px;background:var(--panel);color:var(--muted);text-align:right;padding:10px 9px;line-height:20.8px;overflow:hidden}.editor{border:0;outline:none;resize:none;background:var(--paper);color:var(--ink);font:13px/20.8px Consolas,monospace;padding:10px 12px;flex:1;width:0;overflow:auto;white-space:pre;tab-size:2}.search{position:absolute;z-index:2;top:38px;left:8px;right:8px;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px #17203020}.search-controls{display:flex;gap:5px}.search input{min-width:0;width:100%;padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}.search-info{font-size:11px;color:var(--muted);padding:8px 0}.results{max-height:260px;overflow:auto}.hit{display:block;text-align:left;width:100%;border:0;padding:6px;font-size:12px}.hit small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.notice{font-size:11px;line-height:1.5;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line)}.error{color:var(--danger)}.empty{padding:30px 12px;color:var(--muted);text-align:center}.window{padding:12px;overflow:auto;white-space:pre;font:13px/1.6 Consolas,monospace;flex:1}.window-tools{padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:11px}[hidden]{display:none!important}@media(max-width:650px){.tree-pane{width:170px}.lab{height:auto;min-height:48px}.workspace{height:calc(100dvh - 74px)}.lab small{display:none}.editor-bar{padding:0 6px}.editor-bar button{padding:3px}.gutter{width:32px;padding-right:5px}}
</style></head><body>
<div class="lab"><b>编码区 · 性能状态设计</b><select id="scenario" aria-label="设计场景"><option value="normal">正常编辑</option><option value="loading">目录加载</option><option value="empty">空目录</option><option value="error">读取失败</option><option value="search">搜索进行中</option><option value="partial">部分结果</option><option value="save-error">保存冲突</option><option value="opening">文件准备中</option><option value="window">主动窗口预览</option></select><button id="theme">切换主题</button><small>合成样例 · 不写真实文件 · UI-CR055-FEAT007-v1</small></div>
<div class="workspace"><aside class="tree-pane"><div class="tree-head"><b>文件</b><span class="spacer"></span><button id="search-toggle" aria-label="搜索文件内容">⌕</button><button id="refresh" aria-label="刷新目录">↻</button></div><div id="tree" class="tree" role="tree" aria-label="项目文件"></div><section id="search" class="search" hidden><div class="search-controls"><input id="query" aria-label="搜索文件内容" placeholder="搜索文件内容，Enter 确认"><button id="run">搜索</button><button id="cancel" hidden>取消</button></div><div id="search-info" class="search-info" role="status"></div><div id="results" class="results"></div></section></aside>
<main class="main"><div class="tabs"><button class="tab">million.ts <span id="dirty"></span> ×</button><span class="muted">README.md</span></div><div class="editor-bar"><span class="path">src/million.ts</span><span id="save-status" class="status muted" role="status">已保存</span><button id="preview">窗口预览</button><button id="retry" hidden>重试</button></div><div id="notice" class="notice" hidden></div><div id="edit-stage" class="editor-stage"><div class="gutter" aria-hidden="true">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15<br>16<br>17<br>18<br>19<br>20<br>21<br>22<br>23<br>24<br>25<br>26<br>27<br>28<br>29<br>30</div><textarea id="editor" class="editor" aria-label="代码编辑器" spellcheck="false"></textarea></div><div id="window-tools" class="window-tools" hidden><span>只读窗口 · 按需读取 · 当前编辑草稿仍保留</span><span class="spacer"></span><button id="back-edit">返回编辑</button><button id="next">下一段</button></div><pre id="window" class="window" hidden></pre></main></div>
<script>
const $=id=>document.getElementById(id);let loaded=200,selected=0,mode='normal',timer=null,searchTimer=null,page=0;const content=Array.from({length:300},(_,i)=>`export const value${i+1} = ${i+1}; // 合成编码样例`).join('\n');$('editor').value=content;
const icon='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="M5 2h7l4 4v12H5zM12 2v5h4"/></svg>';
function draw(){const tree=$('tree');if(['loading','empty','error'].includes(mode)){tree.innerHTML='<div class="empty">'+({loading:'加载目录…',empty:'空目录',error:'读取目录失败 · 输入与编辑内容已保留'}[mode])+(mode==='error'?'<button id="reload">重试</button>':'')+'</div>';return}const start=Math.max(0,Math.floor(tree.scrollTop/26)-5),end=Math.min(loaded+1,start+Math.ceil(tree.clientHeight/26)+10);tree.innerHTML=`<div style="height:${(loaded+1)*26}px;position:relative">${Array.from({length:end-start},(_,k)=>{const i=start+k;return i===loaded?`<button class="row" style="position:absolute;top:${i*26}px" data-more>加载更多文件…</button>`:`<button role="treeitem" aria-selected="${i===selected}" class="row ${i===selected?'active':''}" style="position:absolute;top:${i*26}px" data-file="${i}">${icon}<span class="label">module-${String(i+1).padStart(5,'0')}.ts</span></button>`}).join('')}</div>`}
$('tree').addEventListener('scroll',draw);$('tree').onclick=e=>{if(e.target.closest('[data-more]')){loaded+=200;draw()}const row=e.target.closest('[data-file]');if(row){selected=Number(row.dataset.file);draw()}if(e.target.id==='reload'){mode='normal';draw()}};
function showWindow(on){$('edit-stage').hidden=on;$('window-tools').hidden=!on;$('window').hidden=!on;$('window').textContent=content.split('\n').slice(page*40,(page+1)*40).join('\n')}
$('preview').onclick=()=>showWindow(true);$('back-edit').onclick=()=>showWindow(false);$('next').onclick=()=>{page=(page+1)%7;showWindow(true)};$('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
function search(partial=false){clearTimeout(searchTimer);$('search').hidden=false;$('cancel').hidden=false;$('run').disabled=true;$('results').innerHTML='';$('search-info').textContent='搜索中… · 已检查 125 个文件';searchTimer=setTimeout(()=>{$('results').innerHTML=Array.from({length:12},(_,i)=>`<button class="hit">src/module-${i+1}.ts:${i+1}<small>export const value${i+1} = ${i+1};</small></button>`).join('');$('search-info').textContent=partial?'已显示 100 条 · 结果已达上限，未搜索全部范围':'搜索完成 · 12 条结果';$('cancel').hidden=true;$('run').disabled=false},900)}
$('run').onclick=()=>search();$('query').onkeydown=e=>{if(e.key==='Enter')search();if(e.key==='Escape')$('search').hidden=true};$('cancel').onclick=()=>{clearTimeout(searchTimer);$('search-info').textContent='已取消 · 保留已返回结果';$('cancel').hidden=true;$('run').disabled=false};$('search-toggle').onclick=()=>{$('search').hidden=!$('search').hidden};$('refresh').onclick=()=>{mode='normal';loaded=200;draw()};
$('editor').oninput=()=>{$('dirty').textContent='●';$('save-status').textContent='未保存';clearTimeout(timer);timer=setTimeout(()=>{if(mode==='save-error'){ $('save-status').textContent='保存失败 · 内容已保留';$('retry').hidden=false}else{$('save-status').textContent='已保存';$('dirty').textContent=''}},1000)};$('retry').onclick=()=>{$('save-status').textContent='保存失败 · 外部版本冲突，内容已保留'};
$('scenario').onchange=()=>{mode=$('scenario').value;$('notice').hidden=true;$('retry').hidden=true;$('search').hidden=true;showWindow(false);draw();if(mode==='search'||mode==='partial')search(mode==='partial');if(mode==='save-error'){$('notice').hidden=false;$('notice').className='notice error';$('notice').textContent='文件已被外部修改。当前草稿已保留，不自动覆盖。';$('save-status').textContent='保存失败';$('retry').hidden=false}if(mode==='opening'){$('notice').hidden=false;$('notice').className='notice';$('notice').textContent='正在准备文件… · 当前文档仍可编辑';}if(mode==='window')showWindow(true)};
const timers=new Map();document.addEventListener('scroll',e=>{const el=e.target;if(!(el instanceof Element)||el.scrollHeight<=el.clientHeight)return;el.classList.add('scrollbar-active');clearTimeout(timers.get(el));timers.set(el,setTimeout(()=>el.classList.remove('scrollbar-active'),700))},{capture:true,passive:true});new ResizeObserver(draw).observe($('tree'));draw();window.designState=()=>({rows:document.querySelectorAll('[data-file]').length,loaded,selected,mode});
</script></body></html>
