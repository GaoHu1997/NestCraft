<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 工作台 · 视觉风格方案对比</title>
<style>
/* ============ 主题变量：默认 = 现状 v2.5 ============ */
:root{
  --bg:#f6f7f8; --panel:#fff; --panel-2:#fafbfb; --panel-3:#f0f2f3;
  --line:#e2e6e8; --line-strong:#ccd8d5;
  --ink:#1c272d; --ink-2:#55646d; --ink-3:#839398;
  --accent:#096957; --accent-ink:#fff; --accent-soft:#e3f2ee; --accent-line:#cce0d8; --accent-hover:#075646;
  --tag-bg:#edf0f2; --tag-ink:#465762;
  --good-bg:#e3f2ee; --good-ink:#0b5e4d;
  --warn-bg:#fff2dc; --warn-ink:#8a4a08;
  --bad-bg:#fbe8e9; --bad-ink:#a62b32;
  --violet-bg:#f0eafa; --violet-ink:#624690;
  --blue-bg:#e7eff8; --blue-ink:#2b5788;
  --radius:8px; --radius-sm:6px; --radius-pill:999px;
  --shadow:0 1px 2px rgba(20,40,40,.05); --shadow-pop:0 8px 28px rgba(20,40,40,.16);
  --border-w:1px; --fs:14px; --fs-sm:13px; --fs-xs:11px;
  --font-title:inherit; --font-body:system-ui,'Microsoft YaHei',sans-serif;
  --weight-title:750; --tracking-title:-.01em;
  --sidebar-bg:var(--panel-3); --sidebar-ink:var(--ink-2);
  --blur:none; --mono:ui-monospace,Consolas,monospace;
  --focus:#079282;
}
/* ============ A 纸感暖白 ============ */
body[data-theme=paper]{
  --bg:#faf7f1; --panel:#fffdf9; --panel-2:#f7f2e9; --panel-3:#f4eee3;
  --line:#e8dfd0; --line-strong:#d6c8b2;
  --ink:#221f1a; --ink-2:#6b6456; --ink-3:#948b7a;
  --accent:#a8471f; --accent-ink:#fffdf9; --accent-soft:#f8ebe2; --accent-line:#e8c7b4; --accent-hover:#8e3a17;
  --tag-bg:#f1ebdf; --tag-ink:#5d5648;
  --good-bg:#e9efe1; --good-ink:#4a6132;
  --warn-bg:#fbeed6; --warn-ink:#7d5513;
  --bad-bg:#f9e5e2; --bad-ink:#94302a;
  --violet-bg:#efe8f2; --violet-ink:#5f4370;
  --blue-bg:#e7edf3; --blue-ink:#3c5a74;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(90,70,40,.06), 0 12px 32px rgba(90,70,40,.04);
  --fs:14px; --fs-sm:13px;
  --font-title:Georgia,'Songti SC','Noto Serif SC',serif; --font-body:'Inter',system-ui,'Microsoft YaHei',sans-serif;
  --weight-title:600; --tracking-title:0em;
  --focus:#a8471f;
}
/* ============ B 深色工作室 ============ */
body[data-theme=studio]{
  --bg:#0f1417; --panel:#171e22; --panel-2:#1c252a; --panel-3:#141b1f;
  --line:#27333a; --line-strong:#3a4953;
  --ink:#e9f0f3; --ink-2:#9babb5; --ink-3:#71838e;
  --accent:#38cba8; --accent-ink:#052320; --accent-soft:#12332c; --accent-line:#1f574c; --accent-hover:#4ddcba;
  --tag-bg:#232e34; --tag-ink:#b3c2cb;
  --good-bg:#12332c; --good-ink:#66e0c2;
  --warn-bg:#3a2c17; --warn-ink:#f0be74;
  --bad-bg:#3b2023; --bad-ink:#f2a0a6;
  --violet-bg:#2a2338; --violet-ink:#c3abec;
  --blue-bg:#1d2c3c; --blue-ink:#93bef0;
  --radius:8px; --radius-sm:6px;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 26px rgba(0,0,0,.38);
  --font-body:'Inter',system-ui,'Microsoft YaHei',sans-serif;
  --weight-title:700;
  --sidebar-bg:#111a1e; --sidebar-ink:#9babb5;
  --focus:#38cba8;
}
/* ============ C 玻璃渐变 ============ */
body[data-theme=glass]{
  --bg:#eef0fb; --panel:rgba(255,255,255,.76); --panel-2:rgba(255,255,255,.55); --panel-3:rgba(255,255,255,.5);
  --line:rgba(84,88,190,.16); --line-strong:rgba(84,88,190,.28);
  --ink:#1c2040; --ink-2:#5b6180; --ink-3:#838aa8;
  --accent:#5145e5; --accent-ink:#fff; --accent-soft:rgba(81,69,229,.10); --accent-line:rgba(81,69,229,.26); --accent-hover:#4136c9;
  --tag-bg:rgba(81,69,229,.07); --tag-ink:#4b5078;
  --good-bg:rgba(16,158,124,.12); --good-ink:#0b6f57;
  --warn-bg:rgba(199,123,37,.14); --warn-ink:#7d4d0f;
  --bad-bg:rgba(196,55,70,.12); --bad-ink:#9c2433;
  --violet-bg:rgba(124,58,237,.10); --violet-ink:#5d34a8;
  --blue-bg:rgba(37,99,235,.10); --blue-ink:#2a4f96;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(50,50,120,.06), 0 12px 34px rgba(50,50,120,.10);
  --font-body:'Inter',system-ui,'Microsoft YaHei',sans-serif;
  --weight-title:700; --tracking-title:-.02em;
  --sidebar-bg:rgba(255,255,255,.62); --sidebar-ink:#5b6180;
  --blur:blur(20px) saturate(150%);
  --focus:#5145e5;
}
/* ============ D 企业高密度 ============ */
body[data-theme=enterprise]{
  --bg:#f1f4f9; --panel:#fff; --panel-2:#f7f9fc; --panel-3:#eef2f8;
  --line:#dbe3ee; --line-strong:#c2cfdf;
  --ink:#16202e; --ink-2:#5c6b7f; --ink-3:#8494a7;
  --accent:#2361cf; --accent-ink:#fff; --accent-soft:#e8effc; --accent-line:#c3d5f2; --accent-hover:#1b51b0;
  --tag-bg:#eef2f8; --tag-ink:#4d5d71;
  --good-bg:#e6f2ec; --good-ink:#1f6a4d;
  --warn-bg:#fdf0dd; --warn-ink:#8a5310;
  --bad-bg:#fbe9eb; --bad-ink:#a02a36;
  --violet-bg:#efeafa; --violet-ink:#5b3f96;
  --blue-bg:#e8effc; --blue-ink:#24528f;
  --radius:4px; --radius-sm:3px;
  --shadow:none;
  --fs:13px; --fs-sm:12px; --fs-xs:11px;
  --font-body:'Inter',system-ui,'Microsoft YaHei',sans-serif;
  --weight-title:700; --tracking-title:0em;
  --sidebar-bg:var(--panel); --sidebar-ink:#4d5d71;
  --focus:#2361cf;
}
/* ============ E 编辑风（硬边高对比） ============ */
body[data-theme=editorial]{
  --bg:#f3f2ee; --panel:#fff; --panel-2:#f7f6f1; --panel-3:#eeede7;
  --line:#111; --line-strong:#111;
  --ink:#0c0c0c; --ink-2:#4b4b46; --ink-3:#78786f;
  --accent:#1b1bd6; --accent-ink:#fff; --accent-soft:#e9e9ff; --accent-line:#1b1bd6; --accent-hover:#0f0fae;
  --tag-bg:#eeede7; --tag-ink:#33332e;
  --good-bg:#dff3e4; --good-ink:#0c5a2e;
  --warn-bg:#ffefc4; --warn-ink:#6b4a00;
  --bad-bg:#ffe1e1; --bad-ink:#8a1414;
  --violet-bg:#eee6ff; --violet-ink:#4a219b;
  --blue-bg:#e3edff; --blue-ink:#123f96;
  --radius:0px; --radius-sm:0px;
  --shadow:3px 3px 0 var(--line-strong); --shadow-pop:6px 6px 0 var(--line-strong);
  --border-w:2px;
  --font-body:'Inter',system-ui,'Microsoft YaHei',sans-serif;
  --weight-title:800; --tracking-title:-.02em;
  --sidebar-bg:#fff; --sidebar-ink:#33332e;
  --focus:#1b1bd6;
}

/* ============ 基础 ============ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:var(--fs)/1.55 var(--font-body);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body[data-theme=glass]{background:
  radial-gradient(1100px 720px at 8% -12%, rgba(196,190,255,.55) 0%, transparent 58%),
  radial-gradient(1000px 700px at 98% -4%, rgba(186,222,255,.55) 0%, transparent 56%),
  radial-gradient(1000px 760px at 62% 108%, rgba(255,206,236,.42) 0%, transparent 52%),
  #eef0fb;background-attachment:fixed}
body[data-theme=studio]{color-scheme:dark}
h1,h2,h3,p,pre{margin:0}
h1,h2,h3{font-family:var(--font-title);font-weight:var(--weight-title);letter-spacing:var(--tracking-title);line-height:1.3}
p{line-height:1.66}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-size:.92em}

/* ============ 选择器（固定中性） ============ */
.picker{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 82%,#fff 18%);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.picker-in{max-width:1500px;margin:auto;padding:16px 26px 14px;display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap;justify-content:space-between}
.picker h1{font-size:19px;letter-spacing:-.01em}
.picker .sub{font-size:12px;color:var(--ink-2);margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 13px;min-height:36px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--panel);font-size:12.5px;font-weight:650;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.tab i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.16)}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-pressed=true] i{outline:1px solid rgba(255,255,255,.7);outline-offset:1px}
.tab .cur{font-size:10px;opacity:.75;font-weight:600}

/* ============ 舞台 ============ */
.stage{max-width:1500px;margin:auto;padding:26px 26px 60px}
.note{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);box-shadow:var(--shadow)}
.note h2{font-size:16px;margin-bottom:5px}
.note p{font-size:12.5px;color:var(--ink-2)}
.swatches{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);height:auto;min-height:68px}
.swatches span{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:7px 2px;font-size:9.5px;font-family:var(--mono);letter-spacing:-.03em}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.pill{font-size:11px;padding:3px 8px;border-radius:var(--radius-pill);background:var(--panel-3);color:var(--ink-2);border:1px solid var(--line)}

.scene{margin-bottom:30px}
.scene-label{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 2px 9px}
.scene-label b{font-family:var(--mono);font-weight:700;color:var(--accent)}
.window{border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}

/* ============ 应用外壳 ============ */
.shell{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100%}
body[data-theme=enterprise] .shell{grid-template-columns:186px minmax(0,1fr)}
.sidebar{display:flex;flex-direction:column;gap:2px;padding:16px 11px 12px;background:var(--sidebar-bg);border-right:1px solid var(--line);backdrop-filter:var(--blur)}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px 15px;font-weight:750;font-size:14px;color:var(--ink)}
.brandmark{display:grid;place-items:center;width:32px;height:32px;border-radius:calc(var(--radius) - 2px);background:var(--accent);color:var(--accent-ink);flex:none}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);margin-top:1px}
.nav-label{padding:10px 8px 5px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--radius-sm);color:var(--sidebar-ink);font-weight:600;font-size:13px;border:var(--border-w) solid transparent}
.nav a:hover{background:var(--panel-2);color:var(--ink)}
.nav a[aria-current]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.sidefoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:9px}
.profile{display:flex;align-items:center;gap:8px;padding:0 6px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;flex:none}
.profile b{display:block;font-size:12px}
.profile small{display:block;font-size:10.5px;color:var(--ink-3)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 22px;min-height:50px;border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:var(--blur)}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.crumb b{color:var(--ink);font-weight:650}
.demo{font-size:10.5px;padding:3px 8px;border-radius:var(--radius-pill);background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);font-weight:650;white-space:nowrap}
.page{padding:22px 22px 26px;min-width:0}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:26px}
.head p{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 12px;border:var(--border-w) solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);font-weight:650;font-size:13px;line-height:1.3;box-shadow:var(--shadow)}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.sm{min-height:29px;padding:4px 9px;font-size:11.5px}
.btn.icon{padding:6px;min-width:34px}

/* 指标 */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px;background:var(--panel-2)}
.metric{display:flex;align-items:center;gap:10px;padding:12px 15px;border-left:1px solid var(--line);min-width:0}
.metric:first-child{border-left:0}
.metric b{display:block;font-size:20px;line-height:1.2;font-family:var(--font-title);font-weight:var(--weight-title)}
.metric small{display:block;font-size:11px;color:var(--ink-2)}
.metric .icon{color:var(--accent);width:18px;height:18px}
body[data-theme=studio] .metric .icon{color:var(--accent)}

/* 搜索与分段 */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:0 1 290px;min-width:0}
.search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;padding:8px 10px 8px 33px;border:var(--border-w) solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);font-size:12.5px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.segment{display:inline-flex;gap:2px;padding:2px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--radius-sm);flex-wrap:wrap}
.segment button{border:1px solid transparent;background:transparent;border-radius:calc(var(--radius-sm) - 1px);padding:4px 11px;font-size:12px;font-weight:600;color:var(--ink-2);min-height:28px;box-shadow:none}
.segment button[aria-pressed=true]{background:var(--panel);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow)}

/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:9px;padding:14px;border:var(--border-w) solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);min-width:0}
.card:hover{border-color:var(--line-strong)}
.cardtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tileicon{display:grid;place-items:center;width:32px;height:32px;border-radius:calc(var(--radius) - 2px);background:var(--accent-soft);color:var(--accent);flex:none}
.card h3{font-size:15px}
.card p{font-size:12.5px;color:var(--ink-2)}
.cardfoot{margin-top:auto;padding-top:9px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2)}
.data{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2.5px 7px;border-radius:calc(var(--radius-sm) - 2px);background:var(--tag-bg);color:var(--tag-ink);font-size:10.5px;font-weight:650;white-space:nowrap;border:1px solid transparent}
body[data-theme=editorial] .tag{border-color:var(--line)}
.tag.good{background:var(--good-bg);color:var(--good-ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.bad{background:var(--bad-bg);color:var(--bad-ink)}
.tag.violet{background:var(--violet-bg);color:var(--violet-ink)}
.tag.blue{background:var(--blue-bg);color:var(--blue-ink)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none;display:inline-block}
.dot.good{background:var(--good-ink)}.dot.warn{background:var(--warn-ink)}.dot.bad{background:var(--bad-ink)}.dot.blue{background:var(--blue-ink)}.dot.violet{background:var(--violet-ink)}

/* 工作台三栏 */
.workgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(270px,.95fr);gap:0;border-top:1px solid var(--line);min-height:472px}
.pane{display:flex;flex-direction:column;min-width:0}
.pane+.pane{border-left:1px solid var(--line)}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;min-height:40px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12px;font-weight:700}
.panelbody{padding:11px;min-width:0;overflow:auto}
.panelhead .icon{color:var(--ink-3)}

.iter{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border:var(--border-w) solid var(--line);border-radius:var(--radius-sm);background:var(--panel);margin-bottom:10px}
.iter b{font-size:12.5px}
.progress{height:5px;border-radius:99px;background:var(--panel-3);overflow:hidden;margin-top:7px;width:150px}
.progress i{display:block;height:100%;background:var(--accent);width:34%}

.tree{display:grid;gap:4px}
.node{display:flex;align-items:center;gap:7px;padding:6px 8px;border:var(--border-w) solid var(--line);border-radius:var(--radius-sm);background:var(--panel);flex-wrap:wrap;font-size:12.5px}
.node.sel{border-color:var(--accent-line);background:var(--accent-soft)}
.node .tw{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:calc(var(--radius-sm) - 1px);background:var(--panel);font-size:10px;color:var(--ink-2);flex:none;box-shadow:none;padding:0;min-height:22px}
.node .nm{flex:1 1 150px;min-width:0}
.node .nm small{display:block;font-size:10.5px;color:var(--ink-3)}
.node .nm b{font-weight:650}
.children{padding-left:15px;margin-left:14px;border-left:1px solid var(--line);display:grid;gap:5px;margin-top:5px}

.details{display:grid;gap:0;font-size:12.5px}
.details section{padding:10px 0;border-bottom:1px solid var(--line)}
.details section:first-child{padding-top:0}
.details h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;font-family:var(--font-body);font-weight:700}
.checkrow{display:flex;gap:7px;align-items:flex-start;padding:4px 0;line-height:1.55}
.checkrow input{accent-color:var(--accent);width:14px;height:14px;margin-top:2px;flex:none}
.checkrow span{min-width:0}

/* AI 侧栏 */
.chatlog{display:flex;flex-direction:column;gap:8px;padding:11px;flex:1;min-height:0;overflow:auto}
.msg{padding:8px 10px;border-radius:var(--radius-sm);background:var(--panel-2);font-size:12px;line-height:1.55;border:var(--border-w) solid var(--line)}
.msg.user{background:var(--accent-soft);border-color:var(--accent-line);margin-left:20px}
.msg b{display:block;font-size:11px;color:var(--ink-3);margin-bottom:2px;font-weight:700}
.msg code{font-family:var(--mono);background:var(--panel-3);padding:1px 4px;border-radius:3px}
.approval{padding:9px;border:1px solid var(--warn-bg);border-left:3px solid var(--warn-ink);background:var(--warn-bg);color:var(--warn-ink);font-size:11.5px;border-radius:var(--radius-sm)}
.approval .actions{margin-top:7px}
.composer{padding:9px;border-top:1px solid var(--line);display:grid;gap:6px;background:var(--panel)}
.composerbar{display:flex;align-items:center;justify-content:space-between;gap:6px}
.composer textarea{width:100%;min-height:52px;resize:vertical;padding:7px 9px;border:var(--border-w) solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);font-size:12px}
.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:var(--radius-pill);border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:600}
.composer select{font-size:10.5px;padding:3px 6px;border:var(--border-w) solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);max-width:100%}

/* 组件集 */
.bits{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));padding:16px}
.bit{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--panel);box-shadow:var(--shadow);min-width:0}
.bit h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-family:var(--font-body);font-weight:700;margin-bottom:10px}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sheet{width:100%;border-collapse:collapse;font-size:11.5px}
.sheet th,.sheet td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.sheet th{background:var(--panel-2);color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.sheet tr:last-child td{border-bottom:0}
body[data-theme=enterprise] .sheet tbody tr:nth-child(odd){background:var(--panel-2)}
.terminal{border-radius:var(--radius-sm);background:#14212a;color:#e6f1f4;padding:11px;font-family:var(--mono);font-size:11.5px;line-height:1.65;border:1px solid #14212a}
body[data-theme=studio] .terminal{background:#0b1013;border-color:var(--line)}
body[data-theme=editorial] .terminal{border:2px solid #111;border-radius:0}
.terminal .ok{color:#54d6b4}.terminal .warn{color:#f0c06a}.terminal .dim{color:#7f97a2}
.notice{padding:9px 11px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:12px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;line-height:1.55}
.notice.warn{border-color:var(--warn-ink);background:var(--warn-bg);color:var(--warn-ink)}
.dialog{margin-top:10px;border:var(--border-w) solid var(--line-strong);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow-pop);padding:14px;max-width:100%}
.dialog h4{margin:0 0 8px;font-size:14px;font-family:var(--font-title);font-weight:var(--weight-title)}
.dialog label{display:grid;gap:4px;font-size:11.5px;font-weight:650;margin-bottom:9px}
.dialog input{padding:7px 9px;border:var(--border-w) solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);font-size:12px}
.dialog footer{display:flex;justify-content:flex-end;gap:7px}

.foot{max-width:1500px;margin:auto;padding:0 26px 70px;color:var(--ink-2);font-size:12px;line-height:1.8}
.foot b{color:var(--ink)}
.foot ol{padding-left:18px;margin:6px 0}

@media(max-width:1080px){
  .note{grid-template-columns:1fr}
  .workgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .workgrid .pane:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .bits{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:720px){
  .picker-in,.stage,.foot{padding-left:13px;padding-right:13px}
  .shell{grid-template-columns:1fr}
  .sidebar{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .brand{padding:0 6px 0 0;width:100%}
  .nav{display:flex;gap:4px;flex-wrap:wrap;width:100%}
  .nav-label,.sidefoot{display:none}
  .grid,.metrics,.workgrid{grid-template-columns:1fr}
  .metric{border-left:0;border-top:1px solid var(--line)}
  .metric:first-child{border-top:0}
  .pane+.pane{border-left:0;border-top:1px solid var(--line)}
  .head h1{font-size:22px}
}
</style>

const swatches = t => t.colors.map(([k, v]) => {

  const ink = light ? '#2a2a26' : '#f4f4f0';

  return `<span style="background:${v};color:${ink};text-shadow:${shadow}" title="${k} ${v}">${k}</span>`;
}).join('');
function isLight(v) {
  const m = /^#([0-9a-f]{6})$/i.exec(v);
  if (!m) return true; // rgba 类半透明浅色按浅底处理
  const n = parseInt(m[1], 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 145;
}

function render(id) {

  document.querySelector('#app').innerHTML = `${picker()}
  <main class="stage">
    <div class="note">
      <div>
        <h2>${t.name}</h2>
        <p>${t.tagline}</p>
        <div class="meta">${t.fit.map(f => `<span class="pill">${f}</span>`).join('')}</div>
      </div>
      <div>
        <div class="swatches">${swatches(t)}</div>
        <p style="margin-top:8px"><b style="color:var(--ink)">取舍</b>　${t.risk}</p>

    <p style="margin-top:10px"><a class="btn" href="../prototype/index.html" style="display:inline-block;padding:9px 15px;border-radius:7px;background:#a8471f;color:#fffdf9;font-weight:600;text-decoration:none;border:1px solid #a8471f">打开已换肤的原型</a></p>
  </footer>`;
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => {
    const id2 = b.dataset.themeBtn;
    history.replaceState(null, '', `?t=${id2}`);
    render(id2);
  }));
}

render(THEMES.some(t => t.id === initial) ? initial : 'paper');
