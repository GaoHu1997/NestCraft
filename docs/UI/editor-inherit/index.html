@media (max-width:640px){
  .lab{padding:8px 10px;gap:8px}
  .lab select{min-width:0;width:100%}
  .lab label.lbl{width:100%}
  .editor-bar .status,.keyhint{display:none}
  .precision{font-size:11px}
  .picker{width:calc(100vw - 24px)}
}

<script>
'use strict';

const FILES = {};
const INDEX = { java: {}, cs: {}, py: {} };
const ORDER = { java: [], cs: [], py: [] };

function cleanType(s) {
  return String(s).replace(/[{}]/g, '').replace(/<[^>]*>/g, '').replace(/=.*$/, '').trim();
}
function parseDecls(f, opts) {
  const kinds = (opts && opts.kinds) || {};
  f.lines.forEach((line, i) => {
    const n = i + 1;
    let kind = null, name = null, parents = [];
    if (f.lang === 'java') {
      const m = line.match(/^\s*(?:(?:public|protected|private)\s+)?(abstract\s+)?(interface|class|enum)\s+(\w+)/);
      if (m) {
        kind = m[1] ? 'abstract' : m[2]; name = m[3];
        const ext = line.match(/\bextends\s+([A-Za-z0-9_.<>]+(?:\s*,\s*[A-Za-z0-9_.<>]+)*)/);
        const imp = line.match(/\bimplements\s+([A-Za-z0-9_.<>]+(?:\s*,\s*[A-Za-z0-9_.<>]+)*)/);
        if (ext) parents = parents.concat(ext[1].split(',').map(cleanType).filter(Boolean));
        if (imp) parents = parents.concat(imp[1].split(',').map(cleanType).filter(Boolean));
      }
    } else if (f.lang === 'cs') {
      const m = line.match(/^\s*(?:(?:public|protected|private|internal)\s+)?(abstract\s+)?(?:partial\s+)?(interface|class|record)\s+(\w+)(?:\s*<[^>]*>)?\s*(?::\s*([^{]+))?/);
      if (m) {
        kind = m[1] ? 'abstract' : m[2]; name = m[3];
        if (m[4]) parents = m[4].split(',').map(cleanType).filter(Boolean);
      }
    } else if (f.lang === 'py') {
      const m = line.match(/^class\s+(\w+)\s*(?:\(([^)]*)\))?\s*:/);
      if (m) {
        kind = 'class'; name = m[1];
        if (m[2]) parents = m[2].split(',').map(x => cleanType(x.split('=')[0])).filter(Boolean);
      }
    }
    if (!name) return;
    const k = kinds[name] || kind;
    const t = { name, kind: k, lang: f.lang, file: f.path, line: n, parentNames: parents, parentTypes: [], children: [], abstract: k === 'abstract', order: ORDER[f.lang].length };
    INDEX[f.lang][name] = t;
    ORDER[f.lang].push(t);
    f.decls.push({ name, line: n, kind: k });
    f.declByLine[n] = { name, role: 'decl' };
    if (parents.length) f.parentRefs[n] = parents.slice();
  });
}
function addFile(path, lang, lines, opts) {
  const o = opts || {};
  const f = { path, lang, lines, decls: [], declByLine: {}, parentRefs: {}, crumbs: o.crumbs || null };
  FILES[path] = f;
  if (INDEX[lang]) parseDecls(f, o);
  return f;
}

/* ================= 继承索引 ================= */
function buildGraph() {
  ['java', 'cs', 'py'].forEach(lang => {
    ORDER[lang].forEach(t => {
      t.parentTypes = [];
      t.parentNames.forEach(pn => {
        const p = INDEX[lang][pn];
        if (p && p !== t && t.parentTypes.indexOf(p) < 0) t.parentTypes.push(p);
      });
    });
    ORDER[lang].forEach(t => {
      t.parentTypes.forEach(p => { if (p.children.indexOf(t) < 0) p.children.push(t); });
    });
  });
}
buildGraph();

function implementationsOf(t) {
  if (!t) return [];
  const list = [], seen = new Set();
  const direct = t.children.filter(c => !c.abstract && c.kind !== 'interface');
  direct.sort((a, b) => a.order - b.order).forEach(c => { seen.add(c.name); list.push({ type: c, via: null }); });
  const queue = t.children.filter(c => c.abstract || c.kind === 'interface').map(c => ({ node: c, via: c.name }));
  const aSeen = new Set();
  while (queue.length) {
    const cur = queue.shift();
    cur.node.children.forEach(c => {
      if (c.abstract || c.kind === 'interface') {
        if (c !== t && !aSeen.has(c.name)) { aSeen.add(c.name); queue.push({ node: c, via: cur.via }); }
      } else if (!seen.has(c.name)) {
        seen.add(c.name);
        list.push({ type: c, via: cur.via });
      }
    });
  }
  return list;
}
function implNoun(lang) { return lang === 'java' ? '实现' : lang === 'cs' ? '子类型' : '子类'; }

const TREE = (function buildTree() {

  let out = '', i = 0;
  while (i < line.length) {

    if (line.substr(i, 3) === '"""') {
      const j = line.indexOf('"""', i + 3);
      const end = j < 0 ? line.length : j + 3;
      out += '<span class="st">' + esc(line.slice(i, end)) + '</span>'; i = end; continue;
    }
    if (line.substr(i, comment.length) === comment) {
      out += '<span class="cm">' + esc(line.slice(i)) + '</span>'; break;
    }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < line.length && line[j] !== c) { if (line[j] === '\\') j++; j++; }
      out += '<span class="st">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue;

      }
      else if (kws.has(w)) out += '<span class="kw">' + esc(w) + '</span>';
      else out += esc(w);
      i = k; continue;
    }
    if (/[0-9]/.test(c)) {

/* ================= 选择器 ================= */

/* ================= 右键菜单 ================= */
function openCtx(x, y) {
  const t = currentType();
  if (!t) { toast('当前文件不提供代码导航'); return; }
  const impls = implementationsOf(t);
  state.ctxItems = [
    { k: 'impl', label: '跳转到' + implNoun(t.lang), hint: 'Ctrl+Alt+B', n: impls.length },
    { k: 'parent', label: '跳转到父类型', hint: 'Ctrl+U', n: t.parentTypes.length },
    { sep: true },
    { k: 'decl', label: '定位到类型声明', hint: '', n: 1 },
    { k: 'copy', label: '复制类型名', hint: '', n: 1 }
  ];
  const ctx = $('#ctx');
  ctx.innerHTML = state.ctxItems.map((m, i) => {
    if (m.sep) return '<div class="ctx-sep"></div>';
    return '<button type="button" class="ctx-item" role="menuitem" data-k="' + m.k + '" ' + (m.n ? '' : 'disabled') + ' tabindex="-1"><span class="ctx-label">' + esc(m.label) + (m.n > 1 ? '（' + m.n + '）' : '') + '</span>' + (m.hint ? '<kbd>' + esc(m.hint) + '</kbd>' : '') + '</button>';
  }).join('');
  ctx.hidden = false;
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
  ctx.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
  state.ctxOpen = true; state.ctxIndex = 0;
  $$('.ctx-item', ctx).forEach(b => { b.onclick = () => { ctxAction(b.dataset.k); }; });

}
function closeCtx() { state.ctxOpen = false; const c = $('#ctx'); if (c) c.hidden = true; }
function ctxAction(k) {
  if (k === 'impl') { closeCtx(); navImpl(); }
  else if (k === 'parent') { closeCtx(); navParent(); }
  else if (k === 'decl') {
    const t = currentType(); closeCtx();
    if (t) jumpTo(t.file, t.line, { name: t.name });
  } else if (k === 'copy') {
    const t = currentType(); closeCtx();
    if (t) {
      try { if (navigator.clipboard) navigator.clipboard.writeText(t.name); } catch (err) { }
      toast('已复制类型名：' + t.name);

function moveCtx(dir) {
  const items = $$('#ctx .ctx-item:not([disabled])');
  if (!items.length) return;
  let cur = items.findIndex(b => b.classList.contains('kb'));
  cur = cur < 0 ? (dir > 0 ? -1 : 0) : cur;
  cur = (cur + dir + items.length) % items.length;
  items.forEach(b => b.classList.remove('kb'));

/* ================= 场景应用 ================= */
function applyScenario(id, keepLang) {
  closePicker(); closeCtx(); hideGtip();
  const toastEl = $('#toast'); if (toastEl) toastEl.hidden = true; clearTimeout(toastTimer);
  state.scenario = id; state.notice = null; state.highlight = null;
  if (!keepLang) state.lang = 'java';
  if (id === 's3') state.lang = 'cs';
  if (id === 's4') state.lang = 'py';
  const cfg = L[state.lang];
  if (id === 's1') {
    setTabs([cfg.ifaceFile], cfg.ifaceFile);
    state.cursor = declCursor(cfg.ifaceFile, cfg.iface);
    state.highlight = { file: cfg.ifaceFile, line: state.cursor.line };
    renderAll(); scrollToLine();
    const sc = id;
    setTimeout(() => { if (state.scenario === sc && !state.picker) openPicker('impl', state.lang, cfg.iface); }, 60);
  } else if (id === 's2') {
    setTabs([cfg.implFile, cfg.ifaceFile], cfg.implFile);
    const impl = INDEX[state.lang][cfg.impl];
    const target = impl.parentTypes.find(p => p.kind === 'interface') || impl.parentTypes[0];
    if (target) {
      state.activeFile = target.file;
      state.highlight = { file: target.file, line: target.line };
      state.cursor = { lang: state.lang, name: target.name, file: target.file, line: target.line, role: 'decl' };
      renderAll(); scrollToLine();
      toast('已从 ' + cfg.impl + ' 跳到父类型 ' + target.name + ' · ' + target.file + ':' + target.line);
    } else {
      state.cursor = declCursor(cfg.implFile, cfg.impl);
      renderAll();
    }
  } else if (id === 's3') {
    setTabs(['pay-csharp/IOrderService.cs', 'pay-csharp/OrderService.cs', 'pay-csharp/OrderServiceBase.cs'], 'pay-csharp/OrderService.cs');
    state.cursor = refCursor('pay-csharp/OrderService.cs', 'IOrderService');
    state.highlight = { file: 'pay-csharp/OrderService.cs', line: state.cursor.line };
    renderAll(); scrollToLine();
  } else if (id === 's4') {
    setTabs(['pay-python/pay_service.py', 'pay-python/alipay_service.py'], 'pay-python/alipay_service.py');
    state.cursor = refCursor('pay-python/alipay_service.py', 'PayService');
    state.highlight = { file: 'pay-python/alipay_service.py', line: state.cursor.line };
    renderAll(); scrollToLine();
  } else if (id === 's5') {
    setTabs([cfg.abstractFile, cfg.ifaceFile], cfg.abstractFile);
    state.cursor = declCursor(cfg.abstractFile, cfg.abstract);
    state.highlight = { file: cfg.abstractFile, line: state.cursor.line };
    renderAll(); scrollToLine();
  } else if (id === 's6') {
    setTabs([cfg.noImplFile], cfg.noImplFile);
    const t = INDEX[state.lang][cfg.noImpl];
    state.cursor = declCursor(cfg.noImplFile, cfg.noImpl);
    state.notice = { file: cfg.noImplFile, line: t.line, text: '未找到 ' + cfg.noImpl + ' 的' + implNoun(state.lang) };
    renderAll(); scrollToLine();
    const sc = id;
    setTimeout(() => { if (state.scenario === sc) toast(state.notice ? state.notice.text : ''); }, 60);
  } else if (id === 's7') {
    setTabs([cfg.settleFile], cfg.settleFile);
    state.cursor = declCursor(cfg.settleFile, cfg.settle);
    state.highlight = { file: cfg.settleFile, line: state.cursor.line };
    renderAll(); scrollToLine();
    const sc = id;
    setTimeout(() => { if (state.scenario === sc && !state.picker) openPicker('impl', state.lang, cfg.settle); }, 60);
  } else if (id === 's8') {
    const actName = { java: 'AlipayService', cs: 'OrderService', py: 'AlipayService' }[state.lang];
    const actFile = { java: 'pay-java/AlipayService.java', cs: 'pay-csharp/OrderService.cs', py: 'pay-python/alipay_service.py' }[state.lang];
    const others = { java: ['pay-python/alipay_service.py', 'pay-csharp/OrderService.cs'], cs: ['pay-java/AlipayService.java', 'pay-python/alipay_service.py'], py: ['pay-java/AlipayService.java', 'pay-csharp/OrderService.cs'] }[state.lang];
    setTabs([actFile].concat(others), actFile);
    state.cursor = declCursor(actFile, actName);
    state.highlight = { file: actFile, line: state.cursor.line };
    renderAll(); scrollToLine();
  }
}

    this.classList.toggle('on', state.dirsOpenNarrow);
  } else {
    const tp = $('#treePane');
    tp.classList.toggle('collapsed');
    this.classList.toggle('on', !tp.classList.contains('collapsed'));
  }
});
$('#railGit').addEventListener('click', () => toast('Git 面板不在本设计稿范围'));
$('#railExt').addEventListener('click', () => toast('外部编辑器不在本设计稿范围'));
$('#btnCollapse').addEventListener('click', () => {
  $('#treePane').classList.add('collapsed');
  $('#railTree').classList.remove('on');
  if (state.narrow) { state.dirsOpenNarrow = false; $('#treePane').classList.remove('open'); }
});

$('#tree').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  if (row.dataset.type === 'dir') { state.dirs[row.dataset.path] = !(state.dirs[row.dataset.path] !== false); renderTree(); return; }
  openFile(row.dataset.path);
});
$('#tree').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const row = e.target.closest('.row'); if (!row) return;
  e.preventDefault();
  if (row.dataset.type === 'dir') { state.dirs[row.dataset.path] = !(state.dirs[row.dataset.path] !== false); renderTree(); }
  else openFile(row.dataset.path);
});
$('#tabs').addEventListener('click', e => {
  const close = e.target.closest('[data-close]');
  if (close) {
    e.stopPropagation();
    const path = close.dataset.close;
    state.openTabs = state.openTabs.filter(p => p !== path);
    if (state.activeFile === path) {
      const next = state.openTabs[0] || null;
      if (next) openFile(next); else { state.activeFile = null; state.cursor = null; renderAll(); }
    } else renderTabs();
    return;
  }
  const tab = e.target.closest('.tab');
  if (tab) openFile(tab.dataset.path);
});
$('#crumbs').addEventListener('click', e => {
  const c = e.target.closest('[data-crumb]'); if (!c) return;
  toast('面包屑定位：' + c.dataset.crumb);
});
$('#editorBar').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  onNoteAct(b.dataset.act);
});

/* 代码区：gutter / 标识符 / 右键 */
$('#codeWrap').addEventListener('mouseover', e => {
  const g = e.target.closest('.gmark'); if (g) showGtip(g);
});
$('#codeWrap').addEventListener('mouseout', e => {
  if (e.target.closest && e.target.closest('.gmark')) hideGtip();
});
$('#codeWrap').addEventListener('click', e => {
  const g = e.target.closest('.gmark');
  if (g) {
    hideGtip();
    const f = FILES[state.activeFile];
    const t = INDEX[f.lang] && INDEX[f.lang][g.dataset.name];
    if (!t) return;
    const mode = g.dataset.gutter;
    state.cursor = { lang: f.lang, name: t.name, file: t.file, line: t.line, role: 'decl' };
    state.highlight = { file: t.file, line: t.line };
    if (mode === 'impl') {
      const impls = implementationsOf(t);
      if (impls.length === 1) jumpTo(impls[0].type.file, impls[0].type.line, { name: impls[0].type.name });
      else { renderAll(); openPicker('impl', f.lang, t.name); }
    } else {
      if (t.parentTypes.length === 1) jumpTo(t.parentTypes[0].file, t.parentTypes[0].line, { name: t.parentTypes[0].name });
      else { renderAll(); openPicker('parent', f.lang, t.name); }
    }
    return;
  }
  const link = e.target.closest('.tlink');
  if (!link) return;
  const f = FILES[state.activeFile];
  const cl = link.closest('.cl');
  const line = cl ? +cl.dataset.line : 1;
  const name = link.dataset.name;
  if (link.dataset.role === 'parent') {
    state.cursor = { lang: f.lang, name, file: f.path, line, role: 'parent' };
    const target = INDEX[f.lang] && INDEX[f.lang][name];
    if (target) jumpTo(target.file, target.line, { name: target.name });
    else toast('未找到 ' + name + ' 的定义');
  } else {
    state.cursor = { lang: f.lang, name, file: f.path, line, role: 'decl' };
    navImpl();
  }
});
$('#codeWrap').addEventListener('contextmenu', e => {
  const f = state.activeFile ? FILES[state.activeFile] : null;
  if (!f) return;
  if (!INDEX[f.lang]) {
    e.preventDefault();
    toast(META[f.lang].prec);
    return;
  }
  const link = e.target.closest('.tlink');
  if (link) {
    const cl = link.closest('.cl');
    state.cursor = { lang: f.lang, name: link.dataset.name, file: f.path, line: cl ? +cl.dataset.line : 1, role: link.dataset.role };
  }
  e.preventDefault();
  openCtx(e.clientX, e.clientY);
});
document.addEventListener('click', e => {
  if (!e.target || !e.target.isConnected) return;
  if (state.ctxOpen && !e.target.closest('#ctx') && !e.target.closest('#codeWrap')) closeCtx();
  if (state.picker && !e.target.closest('#picker') && !e.target.closest('.hint-chip') && !e.target.closest('.act-btn') && !e.target.closest('.lang-btn') && !e.target.closest('#codeWrap') && !e.target.closest('#ctx') && !e.target.closest('#editorBar') && !e.target.closest('#scenarioNote')) closePicker();
});
document.addEventListener('keydown', e => {
  const inPickerInput = e.target && e.target.id === 'pickerFilter';
  if (e.key === 'Escape') {
    if (state.picker) { e.preventDefault(); closePicker(); return; }
    if (state.ctxOpen) { e.preventDefault(); closeCtx(); return; }
  }
  if (state.ctxOpen) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveCtx(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveCtx(-1); return; }
    if (e.key === 'Enter') { const kb = $('#ctx .ctx-item.kb'); if (kb) { e.preventDefault(); ctxAction(kb.dataset.k); } return; }
  }
  if (state.picker && !inPickerInput) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter') { pickerKey(e); return; }
  }
  if (inPickerInput) return;
  if (e.ctrlKey && e.altKey && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); navImpl(); return; }
  if (e.ctrlKey && !e.altKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); navParent(); }
});
$('#codeWrap').addEventListener('scroll', hideGtip);

/* UI-SCROLL-001：滚动时显示，停止 700ms 隐藏 */
const scrollTimers = new Map();
document.addEventListener('scroll', e => {
  const el = e.target;
  if (!(el instanceof Element)) return;
  if (el.scrollHeight <= el.clientHeight && el.scrollWidth <= el.clientWidth) return;
  el.classList.add('scrollbar-active');
  clearTimeout(scrollTimers.get(el));
  scrollTimers.set(el, setTimeout(() => { el.classList.remove('scrollbar-active'); }, 700));
}, { capture: true, passive: true });

/* ================= 对外状态 ================= */
window.designState = function () {
  const f = state.activeFile ? FILES[state.activeFile] : null;
  const kinds = [];
  const detail = [];
  if (f && INDEX[f.lang]) {
    (f.decls || []).forEach(d => {
      const t = INDEX[f.lang][d.name];
      if (!t) return;
      const down = implementationsOf(t).length;
      const up = t.parentTypes.length;
      detail.push({ name: t.name, down: down, up: up });
      if (down && kinds.indexOf('down') < 0) kinds.push('down');
      if (up && kinds.indexOf('up') < 0) kinds.push('up');
    });
  }
  return {
    version: 'UI-CR094-v1',
    scenario: state.scenario,
    scenarioName: SCENARIO_NAMES[state.scenario],
    lang: state.lang,
    pickerOpen: !!state.picker,
    markerKinds: kinds,
    markerDetail: { down: kinds.indexOf('down') >= 0, up: kinds.indexOf('up') >= 0, types: detail },
    theme: document.documentElement.dataset.theme,
    narrow: state.narrow,
    activeFile: state.activeFile,
    openTabs: state.openTabs.map(p => baseName(p)),
    cursor: state.cursor ? { name: state.cursor.name, role: state.cursor.role, line: state.cursor.line } : null,
    pickerCount: state.picker ? state.picker.items.length : 0,
    pickerFiltered: state.picker ? pickerFiltered().length : 0,
    pickerFilter: state.picker ? state.picker.filter : '',
    breadcrumb: activeCrumbs(),
    notice: state.notice ? state.notice.text : null,
    scrollbars: 'scroll-on-show / 700ms-hide',
    languages: ['java', 'cs', 'py']
  };
};

/* ================= 启动 ================= */
document.documentElement.dataset.theme = 'light';
applyScenario('s1');
</script></body></html>
