return `<div class="kp-transfer" data-kind="${kind}" data-phase="${phase}" role="region" aria-label="${imp?'导入原件任务':'导出原件任务'}"><div class="kp-transfer-head"><b>${imp?'导入原件（大文件）':'导出原件（大文件）'}</b><span>${imp?'入口：左侧文件树「导入原件…」· 与 25 MiB 上传分开':'入口：正文工具栏「导出原件…」· 完整原件，不拼接窗口'} · 队列可滚动</span></div><div class="kp-transfer-states" role="group" aria-label="传输状态">${chips}</div><div class="kp-transfer-queue" tabindex="0" aria-label="原件传输任务队列">${row}${recent}</div>${note?`<p class="kp-transfer-note ${noteTone}">${note}</p>`:''}</div>`}
function bindTransfer(){document.querySelectorAll('[data-transfer-phase]').forEach(b=>b.onclick=()=>{transferPhase=b.dataset.transferPhase;renderTransfer()});document.querySelectorAll('[data-transfer-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.transferAction;if(a==='cancel')transferPhase='cancel-confirm';else if(a==='confirm-cancel')transferPhase='cancelled';else if(a==='resume')transferPhase='copying';else if(a==='restart'||a==='retry')transferPhase='copying';else if(a==='refresh'){$('#read-status').textContent='设计演示：导入完成后刷新当前目录；索引状态不在此处伪报';return}else if(a==='index'){$('#read-status').textContent='设计演示：全文索引状态在右侧「全文索引」任务面板，此处不伪报完成';return}renderTransfer()})}
function renderTransfer(){$('#notice').innerHTML=transferPanel(transferKind,transferPhase);bindTransfer()}
function scene(v){$('#import-entry-row').hidden=true;$('#export-entry').hidden=true;$('#copy').textContent=v==='window'?'复制当前片段':'复制全文';$('#edit-mode').disabled=v==='window';$('#tree-status').innerHTML='';$('#notice').innerHTML='';$('.tree-scroll').hidden=false;$('#more').disabled=false;if(v==='loading'){$('#tree-status').innerHTML='<div class="status" role="status">目录盘点中 · 已处理 1,240 项<button id="cancel">取消盘点</button></div>';$('#cancel').onclick=()=>{scene('cancelled');$('#scene').value='cancelled'}}if(v==='empty'||v==='error'){$('.tree-scroll').hidden=true;$('#more').disabled=true;$('#tree-status').innerHTML=v==='empty'?'<div class="empty">此目录没有文件</div>':'<div class="status error" role="alert">目录读取失败，已有草稿保留<button id="retry">重试</button></div>';if($('#retry'))$('#retry').onclick=()=>{scene('ready');$('#scene').value='ready'}}if(v==='partial')$('#notice').innerHTML='<div class="status warning">索引快照 v42 · 原件待核验 · 仅显示当前可检索范围；18 个文件尚未建立正文索引，附件只可搜名称。已变化源核验前不会发送给 AI。</div>';if(v==='cancelled')$('#tree-status').innerHTML='<div class="status">目录盘点已取消 · 当前已发布目录仍可用</div>';if(v==='budget')$('#notice').innerHTML='<div class="status warning">阅读缓存已达预算；清洁正文和已保存且无修改的草稿可回收，未保存草稿保留。请先关闭不需要的清洁文档后重试。</div>';if(v==='external-change'){$('#notice').innerHTML='<div class="status warning" role="alert">原件已在外部变化，当前未保存草稿保留；保存时会提示版本冲突。<button id="reload-original">放弃草稿并重新读取</button></div>';$('#reload-original').onclick=()=>{$('#read-status').textContent='设计演示：放弃草稿后重新读取原件，不自动丢弃未保存内容'}}if(v==='selection-gone'){$('.tree-scroll').hidden=true;$('#more').disabled=true;$('#tree-status').innerHTML='<div class="status warning" role="alert">所选文件已不存在；不会跳到其它文件或清除草稿。<button id="refresh-tree-2">刷新目录</button></div>';$('#refresh-tree-2').onclick=()=>{scene('ready');$('#scene').value='ready'}}if(v==='large')$('#notice').innerHTML='<div class="status warning">该大文件尚未提供完整排版编辑；不载入整篇以避免阻塞。原件仍可导出，已支持的可编辑文件能力不变。</div>';if(v==='format-limited')$('#notice').innerHTML='<div class="status warning">部分超大段落、代码块或表格按完整原文分段显示，格式展示受限；正文未截断，已有编辑能力与草稿保持。</div>';if(v==='indexing'){$('#notice').innerHTML='<div class="status warning" role="status"><span>全文索引重建中 · 已处理 1,240 个文件 · 查询仍使用快照 v42 · 原件待核验</span><button id="index-cancel">取消索引任务</button></div>';$('#index-cancel').onclick=()=>{$('#notice').innerHTML='<div class="status" role="status">索引任务已取消 · 快照 v42 仍可查询，新索引未发布。</div>'}}if(v==='window'){$('#notice').innerHTML='<div class="status warning">只读窗口 · 原件 5 GiB · 字节范围属于原文件；复制仅当前片段，完整内容可导出。全文搜索不局限当前窗口。</div>';let offset=0;const show=()=>{$('article').innerHTML='<h1>服务运行日志.log</h1><div class="toolbar"><span id="range">'+offset+'–'+(offset+65536)+' / 5368709120 字节</span><button id="window-next">下一片段</button><button id="window-export">导出完整原件</button></div><div class="toolbar"><input id="window-query" placeholder="搜索整个文件"><button id="window-search">全文搜索</button><button id="window-stop">取消搜索</button><span id="window-result"></span></div><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+Array.from({length:100},(_,i)=>'2026-11-21 信息 事务完成 '+(offset+i)).join('\n')+'</pre>';$('#window-next').onclick=()=>{offset+=65536;show()};$('#window-export').onclick=()=>{$('#read-status').textContent='设计演示：调用原件完整导出，不拼接已显示窗口'};let cancelled=false;$('#window-search').onclick=()=>{cancelled=false;$('#window-result').textContent='已扫描 4 MiB · 搜索未完成';setTimeout(()=>{if(!cancelled)$('#window-result').textContent='命中：源字节 700000；扫描可继续，非完整结果'},400)};$('#window-stop').onclick=()=>{cancelled=true;$('#window-result').textContent='搜索已取消，原件保持'}};show();$('.toc nav').innerHTML='<p class="muted">窗口按源字节定位，当前不提供随机行号目录。</p>'}if(v==='transfer-import'||v==='transfer-export'){const k=v==='transfer-import'?'import':'export';if(transferKind!==k){transferKind=k;transferPhase='picking'}$('#import-entry-row').hidden=k!=='import';$('#export-entry').hidden=k!=='export';renderTransfer()}tree()}$('#scene').onchange=e=>scene(e.target.value);$('#import-entry').onclick=()=>{transferKind='import';transferPhase='picking';$('#scene').value='transfer-import';scene('transfer-import')};$('#export-entry').onclick=()=>{transferKind='export';transferPhase='picking';$('#scene').value='transfer-export';scene('transfer-export')};$('#refresh').onclick=()=>{scene('loading');$('#scene').value='loading'};
const timers=new WeakMap();document.addEventListener('scroll',e=>{const el=e.target;if(!(el instanceof Element))return;el.classList.add('scrollbar-active');clearTimeout(timers.get(el));timers.set(el,setTimeout(()=>el.classList.remove('scrollbar-active'),700))},true);body();tree();window.addEventListener('resize',tree);window.designState={scene,setLoaded:n=>{loaded=n;tree()},transfer:(kind,phase)=>{transferKind=kind;transferPhase=phase;scene('transfer-'+kind)}};
</script></body></html>
