<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>知识库文件阅读 · CR-084 设计 v1</title>
<link rel="stylesheet" href="../workbench-v4/tokens.css"><link rel="stylesheet" href="../workbench-v4/base.css">
<style>
body{height:100dvh;display:flex;flex-direction:column}.review{padding:7px 18px;background:var(--warning-soft);color:var(--warning);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}.review label{display:flex;align-items:center;gap:6px}.review select{max-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px}.top{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px}.top strong{font-size:15px}.top .spacer{flex:1}.btn{padding:5px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);white-space:nowrap}.btn:hover{background:var(--surface-3)}button:disabled{opacity:.45;cursor:default}.reader{display:grid;grid-template-columns:232px minmax(0,1fr) 206px;flex:1;min-height:0}.tree,.outline{min-height:0;overflow:auto;background:var(--surface);padding:18px 12px}.tree{border-right:1px solid var(--line)}.outline{border-left:1px solid var(--line)}.side-title{font-size:12px;color:var(--muted);padding:0 9px 12px}.row{display:flex;align-items:center;gap:9px;width:100%;padding:9px;border-radius:6px;text-align:left;min-width:0}.row:hover{background:var(--surface-2)}.row[aria-current="true"]{background:var(--primary-soft);color:var(--primary)}.filename{overflow-wrap:anywhere;font-size:13px}.filemark{display:grid;place-items:center;width:24px;height:28px;border:1px solid currentColor;border-radius:3px;font-size:9px;font-weight:700;flex:none}.md{color:var(--fic-md)}.pdf{color:var(--fic-pdf)}.docx{color:var(--fic-word)}.pptx{color:var(--fic-slides)}.xlsx{color:var(--fic-sheet)}.zip{color:var(--fic-archive)}.center{min-height:0;min-width:0;display:flex;flex-direction:column}.document-head{padding:16px 22px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.title{font-size:16px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;margin-top:3px}.actions{margin-left:auto;display:flex;gap:8px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}.toolbar input{width:48px;padding:3px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);text-align:center}.toolbar select{background:var(--surface);border:1px solid var(--line-strong);padding:4px;border-radius:4px}.stage{flex:1;min-height:0;overflow:auto;padding:28px;background:var(--bg)}.paper{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);padding:42px;min-height:820px;line-height:1.9;overflow-wrap:anywhere}.paper h1{font-size:26px;margin-bottom:20px;line-height:1.5}.paper h2{font-size:18px;margin:24px 0 12px}.paper p{margin:10px 0}.paper table{border-collapse:collapse;width:100%;margin:20px 0}.paper td,.paper th{border:1px solid var(--line);padding:8px;text-align:left}.page-number{margin-top:100px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:12px}.slide{min-height:0;aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;border-top:6px solid var(--primary)}.slide h1{font-size:32px}.slide .page-number{margin-top:24px}.preview-state{max-width:700px;margin:70px auto;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:8px}.preview-state h2{font-size:19px;margin:0 0 12px}.preview-state p{color:var(--ink-2);margin:8px 0 18px}.preview-state .btn{margin-right:8px}.notice{padding:10px 20px;background:var(--warning-soft);color:var(--warning);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.notice button{color:var(--primary);text-decoration:underline}.completion{padding:7px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;flex-wrap:wrap}.source{font-family:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:13px;max-width:820px;margin:auto;padding:24px;background:var(--surface);border:1px solid var(--line)}.code{font-family:var(--mono);max-height:190px;overflow:auto;background:var(--surface-2);padding:12px;white-space:pre}.mobile-toggle,.pane-close{display:none}.info{padding:10px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.outline .row{font-size:12px}.empty{color:var(--muted);padding:12px}.demo-feedback{font-size:12px;color:var(--primary);margin-left:12px}
@media(max-width:1050px){.reader{grid-template-columns:210px minmax(0,1fr)}.outline{display:none}.mobile-toggle[data-panel="outline"]{display:inline-block}.outline.open{display:block;position:fixed;right:0;top:140px;bottom:0;width:230px;z-index:2;box-shadow:var(--shadow-pop)}}
@media(max-width:760px){.reader{grid-template-columns:minmax(0,1fr)}.tree{display:none}.mobile-toggle{display:inline-block}.tree.open{display:block;position:fixed;left:0;top:140px;bottom:0;width:245px;z-index:2;box-shadow:var(--shadow-pop)}.pane-close{display:inline-block;float:right}.document-head{padding:12px;flex-wrap:wrap}.actions{margin-left:0}.stage{padding:12px}.paper{padding:22px;min-height:700px}.slide{min-height:360px;aspect-ratio:auto}.slide h1{font-size:25px}.review{padding:6px 10px;gap:6px}.review select{max-width:155px}.top{padding:8px 12px}.toolbar,.completion,.notice{padding-left:12px;padding-right:12px}.preview-state{margin:20px auto;padding:20px}.source{padding:15px}}
</style>
<script defer src="../workbench-v4/scrollbar.js"></script>
</head>
<body data-design-version="UI-CR084-v1">
<div class="review"><strong>CR-084 · 新设计待实现</strong><span>合成页面夹具；未执行真实 PDF / Office 转换</span><label>状态<select id="state" aria-label="评审状态"><option value="ready">正常阅读</option><option value="limited">排版受限</option><option value="window">大文件分段</option><option value="loading">读取中</option><option value="converting">转换中</option><option value="failed">预览失败</option><option value="converter">转换器不可用</option><option value="password">加密文件</option><option value="denied">读取权限不足</option><option value="missing">原件不存在</option><option value="stale">原件已变化</option><option value="empty">空文件</option><option value="cancelled">已取消</option><option value="none">未选文件</option></select></label></div>
<header class="top"><strong>知识库</strong><span class="muted">/</span><span>产品资料库</span><span class="spacer"></span><a href="../仿真原型UI.html">返回工作台原型</a><button class="btn" id="theme">深色</button></header>
<div class="reader">
<aside class="tree" aria-label="文件目录"><button class="btn pane-close" data-close="tree">关闭</button><div class="side-title">文档与附件</div><div id="files"></div><p class="info">本稿只补充阅读状态。上传、目录操作与编辑沿用既有设计。</p></aside>
<main class="center"><div class="document-head"><button class="btn mobile-toggle" data-panel="tree">文件</button><div id="heading"></div><div class="actions"><button class="btn" id="download">下载原件</button><button class="btn mobile-toggle" data-panel="outline">目录</button></div></div><div id="notice"></div><div class="toolbar" id="tools"></div><div id="stage" class="stage" tabindex="0" aria-label="文档阅读区"></div><footer class="completion"><span id="coverage"></span><span id="feedback" class="demo-feedback" role="status"></span></footer></main>
<aside class="outline" aria-label="正文导航"><button class="btn pane-close" data-close="outline">关闭</button><div class="side-title" id="nav-title">本页目录</div><div id="navigation"></div></aside>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const files=[{id:'md',name:'知识库阅读说明.md',label:'Markdown',pages:1},{id:'pdf',name:'产品使用手册.pdf',label:'PDF 原件',pages:8},{id:'docx',name:'产品需求说明.docx',label:'Word · 转换预览',pages:4},{id:'pptx',name:'产品发布介绍.pptx',label:'PPT · 转换预览',pages:6},{id:'xlsx',name:'迭代计划.xlsx',label:'Excel · 打印页预览',pages:3},{id:'zip',name:'历史资料.zip',label:'ZIP',pages:0}];
let current=files[0],page=1,mode='reading',state='ready',windowIndex=0,zoom='fit';
const sections=['阅读目标','正文完整性','格式与结构','阅读与编辑','异常与恢复','结尾校验'];
const source='# 知识库阅读说明\n\n'+sections.map((h,i)=>'## '+h+'\n\n'+Array.from({length:12},(_,n)=>`第 ${i+1} 节第 ${n+1} 段：资料可以按原来的顺序连续阅读。排版受限时保留原始内容，不能只显示前半篇。中文、English 与 emoji 🧭 都保留。`).join('\n\n')).join('\n\n')+'\n\n[EOF-CR084] 文档结束，所有段落均可访问。';
const chunks=Array.from({length:Math.ceil(source.length/2400)},(_,i)=>source.slice(i*2400,(i+1)*2400));
function select(id){current=files.find(f=>f.id===id);state='ready';$('state').value=state;page=1;mode='reading';windowIndex=0;render();$('stage').scrollTop=0;}
function filesUI(){$('files').innerHTML=files.map(f=>`<button class="row" data-file="${f.id}" aria-current="${current.id===f.id}"><span aria-hidden="true" class="filemark ${f.id}">${f.id==='md'?'MD':f.id==='docx'?'W':f.id==='pptx'?'P':f.id==='xlsx'?'X':f.id.toUpperCase()}</span><span class="filename">${esc(f.name)}</span></button>`).join('');}
function statusUI(title,desc,actions){$('stage').innerHTML=`<section class="preview-state" role="status"><h2>${title}</h2><p>${desc}</p>${actions.map(([text,action])=>`<button class="btn" data-action="${action}">${text}</button>`).join('')}</section>`;$('coverage').textContent='尚无当前版本预览';$('navigation').innerHTML='<p class="empty">暂无可用正文导航</p>';}
function render(){
filesUI();$('heading').innerHTML=`<h1 class="title">${state==='none'?'选择文档':esc(current.name)}</h1><p class="meta">${state==='none'?'从左侧文件目录打开资料':esc(current.label)}${current.id==='md'?' · 只读阅读':''}</p>`;
$('feedback').textContent='';$('notice').innerHTML='';$('tools').innerHTML='';$('navigation').innerHTML='';$('nav-title').textContent=current.id==='md'?'本页目录':'页面导航';$('download').disabled=['denied','missing','none'].includes(state);
const states={loading:['正在读取原件','正在核对文件版本…',[['取消','cancel']]],converting:['正在准备转换预览','本机正在处理文档；当前总页数未知。',[['取消','cancel']]],failed:['预览生成失败','文件损坏或转换失败。原件保持不变，可重试或下载原件。',[['重试','retry'],['下载原件','download']]],converter:['本机转换组件不可用','当前环境无法生成 Office 预览。组件就绪后可重试；也可下载原件。',[['重新检测','retry'],['下载原件','download']]],password:['文件已加密','本轮不支持打开加密文件。可下载原件后使用本机应用查看。',[['下载原件','download']]],denied:['没有本机读取权限','请在系统中恢复对此文件的读取权限，然后重试。',[['重试','retry'],['选择其他文件','other']]],missing:['原件不存在','文件可能已移动或删除。刷新目录后重新选择。',[['刷新目录','other']]],stale:['原件已变化','此前页面不再代表当前原件。重新读取后生成新版本预览。',[['重新读取','retry']]],empty:['文件没有可显示内容','已读取空文件；没有页面或正文。',[['选择其他文件','other']]],cancelled:['已取消预览','原件未改变，可重新开始。',[['重新开始','retry']]],none:['选择要阅读的文件','支持正文阅读及分页预览。',[['打开示例文档','other']]]};
if(states[state]){statusUI(...states[state]);return;}
if(current.id==='zip'){statusUI('此格式暂不支持预览','ZIP 按原件保管，可下载后查看。',[['下载原件','download']]);$('coverage').textContent='原件附件 · 未生成正文预览';return;}
const isMD=current.id==='md';
if(isMD){
const segmented=state==='window';if(state==='limited'){mode='source';$('notice').innerHTML='<div class="notice" role="status">部分内容改用原文阅读；正文仍可完整访问。<button data-action="source">查看完整原文</button></div>';}
if(segmented){mode='source';$('notice').innerHTML='<div class="notice" role="status">大文件分段阅读，当前窗口不代表全文。</div>';}
$('tools').innerHTML=`<button class="btn" data-action="reading" ${state==='limited'?'disabled title="当前排版超过预算，可继续阅读原文"':''} aria-pressed="${mode==='reading'}">阅读</button><button class="btn" data-action="source" aria-pressed="${mode==='source'}">原文</button>${segmented?`<button class="btn" data-action="prev-window" ${windowIndex===0?'disabled':''}>上一段</button><span>第 ${windowIndex+1} / ${chunks.length} 段</span><button class="btn" data-action="next-window" ${windowIndex===chunks.length-1?'disabled':''}>下一段</button>`:''}`;
if(mode==='source'){$('stage').innerHTML='<pre class="source"></pre>';$('stage').firstChild.textContent=segmented?chunks[windowIndex]:source;$('navigation').innerHTML=segmented?chunks.map((_,i)=>`<button class="row" data-window="${i}" aria-current="${i===windowIndex}">原文第 ${i+1} 段</button>`).join(''):'<p class="empty">完整原文模式</p>';}
else{$('stage').innerHTML=`<article class="paper"><h1>知识库阅读说明</h1>${sections.map((h,i)=>`<section id="section-${i}"><h2>${i+1}. ${h}</h2>${Array.from({length:12},(_,n)=>`<p>第 ${i+1} 节第 ${n+1} 段：资料可以按原来的顺序连续阅读。排版受限时保留原始内容，不能只显示前半篇。中文、English 与 emoji 🧭 都保留。</p>`).join('')}${i===2?'<pre class="code">'+esc(Array.from({length:20},(_,n)=>'样例代码行 '+(n+1)+'：可独立滚动').join('\n'))+'</pre>':''}</section>`).join('')}<p id="eof">[EOF-CR084] 文档结束，所有段落均可访问。</p></article>`;$('navigation').innerHTML=sections.map((h,i)=>`<button class="row" data-heading="section-${i}">${i+1}. ${h}</button>`).join('');}
$('coverage').textContent=segmented?`原文第 ${windowIndex+1}/${chunks.length} 段 · ${windowIndex===chunks.length-1?'已到文件末尾':'后续仍有内容'}`:mode==='source'?'完整原文已加载 · '+source.length+' 字符':'全文已加载 · 6 个章节';
}else{
$('tools').innerHTML=`<button class="btn" data-action="prev" ${page===1?'disabled':''}>上一页</button><label>第 <input id="page-number" type="number" min="1" max="${current.pages}" value="${page}" aria-label="页码"> / ${current.pages} 页</label><button class="btn" data-action="next" ${page===current.pages?'disabled':''}>下一页</button><select id="zoom" aria-label="缩放"><option value="fit">适合宽度</option><option value="100">100%</option><option value="125">125%</option></select>`;
$('zoom').value=zoom;
const title=current.id==='pptx'?['让资料随时可读','查看产品全貌','规划使用场景','审阅关键文档','清晰处理异常','完成阅读与评审'][page-1]:current.id==='xlsx'?'迭代计划 · 打印页 '+page:current.id==='docx'?'产品需求说明 · 第 '+page+' 节':'产品使用手册 · 第 '+page+' 章';
$('stage').innerHTML=`<article class="paper ${current.id==='pptx'?'slide':''}" style="max-width:${zoom==='125'?'920':zoom==='100'?'800':'760'}px"><div class="meta">${esc(current.label)}</div><h1>${title}</h1><p>本地资料，连续阅读</p><p>在同一个工作区中查看页面内容，按页定位并调整缩放。下载原件始终保留原文件。</p>${current.id==='xlsx'?'<table><thead><tr><th>事项</th><th>阶段</th></tr></thead><tbody><tr><td>文档阅读</td><td>需求评审</td></tr><tr><td>分页预览</td><td>设计审阅</td></tr></tbody></table><p class="meta">打印页预览仅展示文档打印范围。</p>':current.id!=='pptx'?'<h2>本章内容</h2><p>支持的文档在阅读区呈现，导航与当前页面同步。转换预览的字体和版式可能与原件略有差异。</p>':''}<div class="page-number">第 ${page} / ${current.pages} 页${page===current.pages?' · 已到最后一页':''}</div></article>`;
$('navigation').innerHTML=Array.from({length:current.pages},(_,i)=>`<button class="row" data-page="${i+1}" aria-current="${page===i+1}">${current.id==='pptx'?'幻灯片':'第'} ${i+1} ${current.id==='pptx'?'':'页'}</button>`).join('');$('coverage').textContent=`当前第 ${page} / ${current.pages} 页 · ${page===current.pages?'已到最后一页':'可继续翻页'}`;
}
}
function action(a){if(a==='download'){$('feedback').textContent='设计演示：此处下载完整原件，当前夹具没有真实附件。';return;}if(a==='other'){select('md');return;}if(a==='retry'){state='ready';$('state').value=state;render();return;}if(a==='cancel'){state='cancelled';$('state').value=state;render();return;}if(a==='source')mode='source';if(a==='reading'){mode='reading';if(state==='window'){state='ready';$('state').value=state;}}if(a==='next')page=Math.min(current.pages,page+1);if(a==='prev')page=Math.max(1,page-1);if(a==='next-window')windowIndex=Math.min(chunks.length-1,windowIndex+1);if(a==='prev-window')windowIndex=Math.max(0,windowIndex-1);render();$('stage').scrollTop=0;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.file){select(b.dataset.file);document.querySelector('.tree').classList.remove('open');}else if(b.dataset.action)action(b.dataset.action);else if(b.dataset.page){page=Number(b.dataset.page);render();$('stage').scrollTop=0;}else if(b.dataset.window){windowIndex=Number(b.dataset.window);render();$('stage').scrollTop=0;}else if(b.dataset.heading)$(b.dataset.heading)?.scrollIntoView({block:'start'});else if(b.dataset.panel){const panel=document.querySelector('.'+b.dataset.panel);panel.classList.toggle('open');panel.querySelector('button')?.focus();}else if(b.dataset.close){document.querySelector('.'+b.dataset.close).classList.remove('open');document.querySelector(`[data-panel="${b.dataset.close}"]`)?.focus();}});
$('state').onchange=e=>{state=e.target.value;if(['converting','converter'].includes(state)&&!['docx','pptx','xlsx'].includes(current.id))current=files[2];if(state==='password'&&current.id==='md')current=files[1];if(['limited','window'].includes(state)&&current.id!=='md'){current=files[0];mode='reading';}render();$('stage').scrollTop=0;};
$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'浅色':'深色';};$('download').onclick=()=>action('download');
document.addEventListener('change',e=>{if(e.target.id==='page-number'){const n=Number(e.target.value);page=Number.isFinite(n)?Math.max(1,Math.min(current.pages,Math.trunc(n))):1;render();$('stage').scrollTop=0;}if(e.target.id==='zoom'){zoom=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.open').forEach(p=>{p.classList.remove('open');document.querySelector(`[data-panel="${p.classList.contains('tree')?'tree':'outline'}"]`)?.focus();});}});
render();
})();
</script>
</body>
</html>
