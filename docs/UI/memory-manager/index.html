<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>记忆管理 · UI-FEAT-026-v2</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --text:#1c2026; --muted:#6b7280; --line:#e5e7eb;
    --primary:#2f6bff; --primary-soft:#eaf0ff; --warn:#b45309; --danger:#dc2626;
    --chip:#f1f3f6; --shadow:0 1px 2px rgba(16,24,40,.06);
    --c-fact:#2563eb; --c-pref:#7c3aed; --c-goal:#059669; --c-event:#d97706; --c-decision:#db2777; --c-relation:#0891b2;
  }
  body.dark{
    --bg:#16181d; --panel:#1e2127; --text:#e6e8ec; --muted:#9aa2ad; --line:#2c313a;
    --primary:#6b93ff; --primary-soft:#1d2740; --chip:#252a32; --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .app{height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  .crumb{color:var(--muted);font-size:13px}
  .crumb b{color:var(--text);font-weight:600}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .tabs{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{padding:11px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .content{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:16px 20px;min-height:0}
  .pane{display:none;flex:1;min-height:0;flex-direction:column}
  .pane.active{display:flex}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .search{flex:1;min-width:160px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 10px}
  .search input{border:0;outline:0;background:transparent;color:var(--text);width:100%;padding:8px 4px;font-size:13px}
  select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px}
  .scroll-area{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding-right:4px;
    scrollbar-width:thin;scrollbar-color:transparent transparent}
  .scroll-area.scrolling{scrollbar-color:#b9c0cc transparent}
  .scroll-area::-webkit-scrollbar{width:10px;height:10px}
  .scroll-area::-webkit-scrollbar-thumb{background:transparent;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  .scroll-area.scrolling::-webkit-scrollbar-thumb{background:#b9c0cc;background-clip:padding-box}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .card.head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted);white-space:nowrap}
  .badge.fact{color:var(--c-fact)} .badge.preference{color:var(--c-pref)} .badge.goal{color:var(--c-goal)}
  .badge.event{color:var(--c-event)} .badge.decision{color:var(--c-decision)} .badge.relation{color:var(--c-relation)}
  .stars{color:#f59e0b;font-size:12px;letter-spacing:1px}
  .card .body{font-size:14px;margin:2px 0 8px}
  .meta{display:flex;gap:14px;color:var(--muted);font-size:12px;flex-wrap:wrap}
  .row-actions{margin-left:auto;display:flex;gap:6px;opacity:0;transition:.15s}
  .card:hover .row-actions{opacity:1}
  .mini{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px}
  .mini:hover{background:var(--chip);color:var(--primary)}
  .mini.danger:hover{color:var(--danger)}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;min-height:200px}
  .empty .ic{font-size:36px;opacity:.5}
  .profile-grid{display:grid;grid-template-columns:180px 1fr;gap:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .profile-grid .k{color:var(--muted)}
  .profile-summary{background:var(--primary-soft);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;white-space:pre-wrap}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .stat .n{font-size:26px;font-weight:700}
  .stat .l{color:var(--muted);font-size:12px;margin-top:2px}
  textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:8px;font:inherit}
  .hint{color:var(--muted);font-size:12px;margin:6px 0 0}
  @media (max-width:520px){ .content{padding:12px} .topbar{padding:10px 12px} .profile-grid{grid-template-columns:1fr} .row-actions{opacity:1} #scope{width:100%;flex:0 0 100%} }
</style>
</head>
<body><!-- 本页数据全部为合成演示，不表示用户实际画像或项目事实。 -->
<div class="app">
  <header class="topbar">
    <span class="crumb">知识库 · <b>记忆</b></span>
    <span class="spacer"></span>
    <button class="btn" id="toggleEmpty">切换空态</button>
    <button class="btn" id="toggleTheme">深色</button>
    <button class="btn primary" id="addBtn">＋ 新增记忆</button>
  </header>
  <div class="toolbar" style="padding:12px 20px;margin:0"><select id="scope" aria-label="记忆范围"><option value="global">个人记忆（跨项目通用）</option><option value="project:a">项目 A</option><option value="project:b">项目 B</option></select><span class="hint" id="scopeHint">个人记忆同步到个人记忆知识库，所有项目可按需读取。</span></div><nav class="tabs">
    <div class="tab active" data-tab="list">记忆</div>
    <div class="tab" data-tab="profile">画像</div>
    <div class="tab" data-tab="stats">统计</div>
  </nav>
  <main class="content">
    <!-- 列表 -->
    <section class="pane active" data-pane="list">
      <div class="toolbar">
        <div class="search"><input id="q" placeholder="搜索记忆…" /></div>
        <select id="kindFilter">
          <option value="">全部类型</option>
          <option value="fact">事实</option><option value="preference">偏好</option>
          <option value="goal">目标</option><option value="event">事件</option>
          <option value="decision">决策</option><option value="relation">关系</option>
        </select>
        <select id="statusFilter"><option value="active">生效中</option><option value="">全部状态</option><option value="superseded">已被取代</option></select>
      </div>
      <div class="scroll-area" id="listArea"><div id="list"></div></div>
      <div class="empty" id="listEmpty" style="display:none"><div class="ic">🗂️</div><div>还没有记忆</div><div class="hint">AI 会在会话结束后自动沉淀，你也可以手动新增</div></div>
    </section>
    <!-- 画像 -->
    <section class="pane" data-pane="profile">
      <div class="scroll-area">
        <div class="profile-summary" id="profSummary">（画像摘要）</div>
        <div class="profile-grid" id="profGrid"></div>
        <p class="hint">画像由记忆自动归纳，也可手动编辑「摘要」。数据仅保存在本地。</p>
      </div>
    </section>
    <!-- 统计 -->
    <section class="pane" data-pane="stats">
      <div class="scroll-area"><div class="stats-grid" id="statsGrid"></div></div>
    </section>
  </main>
</div>
<script>
  const SEED = [
    {id:'m1',kind:'preference',content:'偏好用 TypeScript 而非 JavaScript 写前端',importance:4,trust:'own',source:'message',sourceRef:'msg-1024',status:'active',at:'2026-11-24 10:12',memKey:'lang-pref'},
    {id:'m2',kind:'fact',content:'用户的主力开发机是 Windows，使用便携版应用',importance:3,trust:'own',source:'session',sourceRef:'sess-88',status:'active',at:'2026-11-24 09:40',memKey:'os'},
    {id:'m3',kind:'goal',content:'正在把 Agent 工作台做成可长期使用的个人助手',importance:5,trust:'own',source:'message',sourceRef:'msg-0981',status:'active',at:'2026-11-23 21:05',memKey:'main-goal'},
    {id:'m4',kind:'decision',content:'知识库采用 Markdown 本地文件 + FTS5 混合语义检索',importance:4,trust:'own',source:'session',sourceRef:'sess-71',status:'active',at:'2026-11-22 15:30',memKey:'kb-arch'},
    {id:'m5',kind:'preference',content:'喜欢简洁、信息密度高的界面，不要花哨动画',importance:4,trust:'own',source:'message',sourceRef:'msg-0950',status:'active',at:'2026-11-21 18:20',memKey:'ui-pref'},
    {id:'m6',kind:'relation',content:'常用协作工具是 Obsidian 与 VS Code',importance:2,trust:'own',source:'message',sourceRef:'msg-0933',status:'active',at:'2026-11-20 11:00',memKey:'tools'},
    {id:'m7',kind:'fact',content:'（来自网页，低信任）某开源库号称支持记忆',importance:1,trust:'external',source:'doc',sourceRef:'web-12',status:'active',at:'2026-11-19 08:15',memKey:''},
    {id:'m8',kind:'preference',content:'偏好用 pnpm 管理依赖（曾用 npm，已改）',importance:3,trust:'own',source:'message',sourceRef:'msg-0900',status:'superseded',supersededBy:'m9',at:'2026-11-18 09:00',memKey:'pkg-mgr'},
  ];
  const KIND_LABEL={fact:'事实',preference:'偏好',goal:'目标',event:'事件',decision:'决策',relation:'关系'};
  SEED.forEach(i=>i.scope='global');
  SEED.push({id:'pa',scope:'project:a',kind:'decision',content:'（合成）项目 A 使用 SQLite',importance:4,trust:'own',status:'active',source:'manual',sourceRef:'',at:'演示',memKey:'db'});
  SEED.push({id:'pb',scope:'project:b',kind:'decision',content:'（合成）项目 B 使用 PostgreSQL',importance:4,trust:'own',status:'active',source:'manual',sourceRef:'',at:'演示',memKey:'db'});
  const state={items:SEED.slice(),scope:'global',q:'',kind:'',status:'active',empty:false,pane:'list'};
  const $=s=>document.querySelector(s);
  function stars(n){return '★'.repeat(n)+'☆'.repeat(Math.max(0,5-n));}
  function renderList(){
    const box=$('#list'), empty=$('#listEmpty');
    let rows=state.items.filter(i=>{
      if(i.scope!==state.scope)return false;
      if(state.status && i.status!==state.status) return false;
      if(state.kind && i.kind!==state.kind) return false;
      if(state.q && !i.content.includes(state.q)) return false;
      return true;
    });
    if(state.empty || rows.length===0){ box.innerHTML=''; empty.style.display='flex'; $('#listArea').style.display='none'; return; }
    empty.style.display='none'; $('#listArea').style.display='block';
    box.innerHTML=rows.map(i=>`
      <div class="card" data-id="${i.id}">
        <div class="card head">
          <span class="badge ${i.kind}">${KIND_LABEL[i.kind]||i.kind}</span>
          <span class="badge">${i.scope==='global'?'个人记忆':'项目记忆'}</span><span class="stars" title="重要度">${stars(i.importance)}</span>
          ${i.status==='superseded'?'<span class="badge">已被取代</span>':''}
          ${i.trust==='external'?'<span class="badge" title="外部来源，低信任">外部</span>':''}
          <span class="row-actions">
            <button class="mini" data-act="edit" data-id="${i.id}">编辑</button>
            <button class="mini danger" data-act="del" data-id="${i.id}">删除</button>
          </span>
        </div>
        <div class="body">${i.content}</div>
        <div class="meta"><span>来源：${i.source}${i.sourceRef?' · '+i.sourceRef:''}</span><span>${i.at}</span></div>
      </div>`).join('');
  }
  function renderProfile(){
    const fields=[['身份','独立开发者 / 产品负责人'],['常用技术栈','TypeScript · Rust · Tauri'],['沟通偏好','简洁直接、先结论'],['当前目标','打磨个人 Agent 工作台'],['工作环境','Windows · 便携版'],['偏好','高信息密度界面 · pnpm']];
    $('#profSummary').textContent='用户是一位独立开发者，正在打造可长期使用的个人 Agent 工作台。偏简洁高信息密度界面，前端偏好 TypeScript，依赖管理用 pnpm。';
    if(state.scope!=='global'){ $('#profSummary').textContent='当前项目的约束与决定，不混入个人画像'; fields.splice(0,fields.length,['项目约束',state.items.filter(i=>i.scope===state.scope).map(i=>i.content).join('；')]); }
    $('#profGrid').innerHTML=fields.map(([k,v])=>`<div class="k">${k}</div><div>${v}</div>`).join('');
  }
  function renderStats(){
    const items=state.items.filter(i=>i.scope===state.scope);
    const total=items.length;
    const byKind={}; items.forEach(i=>byKind[i.kind]=(byKind[i.kind]||0)+1);
    const active=items.filter(i=>i.status==='active').length;
    const sup=items.filter(i=>i.status==='superseded').length;
    const cards=[['总记忆数',total],['生效中',active],['已被取代',sup],...Object.entries(byKind).map(([k,v])=>[KIND_LABEL[k]||k,v])];
    $('#statsGrid').innerHTML=cards.map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  }
  function renderAll(){renderList();renderProfile();renderStats();}
  // 页签
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); state.pane=t.dataset.tab;
    document.querySelector(`.pane[data-pane="${t.dataset.tab}"]`).classList.add('active');
  });
  $('#scope').onchange=e=>{state.scope=e.target.value;state.empty=false;$('#scopeHint').textContent=state.scope==='global'?'个人记忆跨项目通用，并同步到个人记忆知识库。':'项目记忆仅当前项目可用，不进入通用个人知识库。';renderAll();};
  // 筛选/搜索
  $('#q').oninput=e=>{state.q=e.target.value.trim();renderList();};
  $('#kindFilter').onchange=e=>{state.kind=e.target.value;renderList();};
  $('#statusFilter').onchange=e=>{state.status=e.target.value;renderList();};
  // 操作
  $('#list').addEventListener('click',e=>{
    const b=e.target.closest('button[data-act]'); if(!b) return;
    const id=b.dataset.id;
    if(b.dataset.act==='del'){ if(confirm('删除这条记忆？')){ state.items=state.items.filter(i=>i.id!==id); renderAll(); } }
    if(b.dataset.act==='edit'){ const it=state.items.find(i=>i.id===id); const v=prompt('编辑记忆内容',it.content); if(v!=null&&v.trim()){it.content=v.trim();renderAll();} }
  });
  $('#toggleEmpty').onclick=()=>{state.empty=!state.empty;renderList();};
  $('#toggleTheme').onclick=()=>{document.body.classList.toggle('dark');$('#toggleTheme').textContent=document.body.classList.contains('dark')?'浅色':'深色';};
  $('#addBtn').onclick=()=>{ const v=prompt('新增一条记忆（偏好/事实/目标…）'); if(v&&v.trim()){ state.items.unshift({id:'n'+Date.now(),scope:state.scope,kind:'fact',content:v.trim(),importance:3,trust:'own',source:'manual',sourceRef:'',status:'active',at:'刚刚',memKey:''}); state.status='active';renderAll(); } };
  // UI-SCROLL-001：滚动时显示，停止后隐藏
  document.querySelectorAll('.scroll-area').forEach(a=>{
    let t; a.addEventListener('scroll',()=>{ a.classList.add('scrolling'); clearTimeout(t); t=setTimeout(()=>a.classList.remove('scrolling'),700); });
  });
  renderAll();
</script>
</body>
</html>
