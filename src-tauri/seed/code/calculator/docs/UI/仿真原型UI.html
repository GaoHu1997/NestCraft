<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>计算器 · 仿真原型 UI-CALC-v1</title>
<style>
  :root{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--border:#dde1e8;--text:#1b1f26;--muted:#6a7280;--accent:#2f6feb;--accentSoft:#e8f0ff;--danger:#c0392b}
  @media (prefers-color-scheme:dark){:root{--bg:#14171c;--surface:#1c2027;--surface2:#242932;--border:#303641;--text:#eef1f6;--muted:#98a1b0;--accent:#5b8cff;--accentSoft:#1f2c46;--danger:#ff7b6b}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .proto-note{position:fixed;left:16px;top:12px;font-size:12px;color:var(--muted)}
  .calc{display:grid;grid-template-columns:minmax(280px,340px) minmax(220px,280px);gap:16px;width:min(100%,660px)}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
  .screen{background:var(--surface2);border-radius:10px;padding:12px 14px;text-align:right;margin-bottom:14px}
  .exp{min-height:20px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .disp{font-size:34px;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums;word-break:break-all}
  .disp[data-error=true]{font-size:18px;font-weight:500;color:var(--danger)}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .key{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:14px 0;font-size:17px;cursor:pointer;transition:background 120ms,transform 60ms}
  .key:hover{background:var(--surface2)}.key:active{transform:scale(.97)}.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .key.fn{color:var(--muted);font-size:15px}
  .key.op{color:var(--accent);background:var(--accentSoft);border-color:transparent;font-size:18px}
  .key.eq{color:#fff;background:var(--accent);border-color:transparent}
  .hint{margin:12px 2px 0;font-size:12px;color:var(--muted);line-height:1.8}
  .hint kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px;background:var(--surface2)}
  .history{display:flex;flex-direction:column;min-height:0}
  .history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .history-head h2{font-size:14px;margin:0}
  .link{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:2px 4px}
  .history-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
  .item{width:100%;display:flex;flex-direction:column;align-items:flex-end;gap:2px;border:0;background:none;color:inherit;padding:6px 8px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
  .item:hover{background:var(--surface2)}
  .item .e{font-size:12px;color:var(--muted)}.item .r{font-size:15px;font-weight:600}
  .empty{color:var(--muted);font-size:13px;margin:8px 4px}
  @media (max-width:620px){.calc{grid-template-columns:1fr}.history{max-height:220px}}
</style>
</head>
<body>
<p class="proto-note">仿真原型 UI-CALC-v1 · 全部按键可操作 · 合成数据</p>
<main class="calc" aria-label="计算器原型">
  <section class="panel">
    <div class="screen">
      <div class="exp" id="exp">&nbsp;</div>
      <output class="disp" id="disp" role="status">0</output>
    </div>
    <div class="keys" role="group" aria-label="计算按键">
      <button class="key fn" data-a="allClear" aria-label="全部清除">AC</button>
      <button class="key fn" data-a="clear" aria-label="清除当前输入">C</button>
      <button class="key fn" data-a="percent" aria-label="百分比">%</button>
      <button class="key op" data-a="op" data-v="÷" aria-label="除">÷</button>
      <button class="key" data-a="digit" data-v="7">7</button>
      <button class="key" data-a="digit" data-v="8">8</button>
      <button class="key" data-a="digit" data-v="9">9</button>
      <button class="key op" data-a="op" data-v="×" aria-label="乘">×</button>
      <button class="key" data-a="digit" data-v="4">4</button>
      <button class="key" data-a="digit" data-v="5">5</button>
      <button class="key" data-a="digit" data-v="6">6</button>
      <button class="key op" data-a="op" data-v="-" aria-label="减">−</button>
      <button class="key" data-a="digit" data-v="1">1</button>
      <button class="key" data-a="digit" data-v="2">2</button>
      <button class="key" data-a="digit" data-v="3">3</button>
      <button class="key op" data-a="op" data-v="+" aria-label="加">+</button>
      <button class="key" data-a="negate" aria-label="正负号">±</button>
      <button class="key" data-a="digit" data-v="0">0</button>
      <button class="key" data-a="dot" aria-label="小数点">.</button>
      <button class="key eq" data-a="equals" aria-label="等于">=</button>
    </div>
    <p class="hint">键盘：数字 · <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> · <kbd>Enter</kbd> 等于 · <kbd>Backspace</kbd> 退格 · <kbd>Esc</kbd> 全部清除</p>
  </section>
  <aside class="panel history" aria-label="历史记录">
    <header class="history-head"><h2>历史记录</h2><button class="link" id="clear" type="button">清空</button></header>
    <ol class="history-list" id="list"></ol>
    <p class="empty" id="empty">还没有计算记录</p>
  </aside>
</main>
<script>
/* 原型自包含实现：与 src/calculator.js 同构，用于设计走查，不参与构建。 */
const MAX_HISTORY = 20, DIVZERO = "不能除以 0", MAXD = 10;
const fmt = v => { if (!isFinite(v)) return DIVZERO; if (v === 0) return "0"; const r = Number(v.toFixed(MAXD)); return Math.abs(r) >= 1e15 ? r.toExponential(6).replace(/\.?0+e/, "e") : String(r); };
function init() { return { entry: "0", display: "0", left: null, op: null, waiting: false, error: null, expression: "", lastOp: null, lastOperand: null, committed: null }; }
const wd = s => ({ ...s, display: s.error ? s.error : s.entry });
function apply(l, op, r) { return op === "+" ? l + r : op === "-" ? l - r : op === "×" ? l * r : op === "÷" ? (r === 0 ? null : l / r) : r; }
function compute(s, r) { const v = apply(s.left ?? 0, s.op, r); if (v === null) return { ...init(), error: DIVZERO, display: DIVZERO }; if (!isFinite(v)) return { ...init(), error: "结果超出范围", display: "结果超出范围" }; return v; }
function reduce(s, a) {
  switch (a.type) {
    case "digit": {
      if (s.error || s.waiting) return wd({ ...s, entry: a.value, waiting: false, error: null });
      if (s.entry.replace(/[-.]/g, "").length >= 15) return s;
      return wd({ ...s, entry: s.entry === "0" ? a.value : s.entry + a.value });
    }
    case "dot": if (s.error || s.waiting) return wd({ ...s, entry: "0.", waiting: false, error: null }); if (s.entry.includes(".")) return s; return wd({ ...s, entry: s.entry + "." });
    case "op": {
      if (s.error) return wd({ ...s, error: null, entry: "0", left: null, op: a.value, waiting: true });
      const cur = Number(s.entry);
      if (s.op && s.waiting) return wd({ ...s, op: a.value, expression: fmt(s.left ?? 0) + " " + a.value });
      if (s.op) { const r = compute(s, cur); if (typeof r !== "number") return r; const t = fmt(r); return wd({ ...s, left: r, entry: t, display: t, op: a.value, waiting: true, expression: t + " " + a.value }); }
      return wd({ ...s, left: cur, op: a.value, waiting: true, expression: fmt(cur) + " " + a.value });
    }
    case "equals": {
      if (s.error) return s;
      if (!s.op) { if (s.lastOp !== null && s.waiting) { const r = apply(Number(s.entry), s.lastOp, s.lastOperand); if (r === null) return { ...init(), error: DIVZERO, display: DIVZERO }; const t = fmt(r); return wd({ ...s, entry: t, display: t, waiting: true, expression: fmt(Number(s.entry)) + " " + s.lastOp + " " + fmt(s.lastOperand) + " = " + t, committed: fmt(Number(s.entry)) + " " + s.lastOp + " " + fmt(s.lastOperand) + " = " + t }); } return wd({ ...s, waiting: true }); }
      const r = compute(s, Number(s.entry)); if (typeof r !== "number") return r; const t = fmt(r); const e = fmt(s.left ?? 0) + " " + s.op + " " + fmt(Number(s.entry)) + " = " + t;
      return wd({ ...s, left: r, entry: t, display: t, op: null, waiting: true, expression: e, lastOp: s.op, lastOperand: Number(s.entry), committed: e });
    }
    case "clear": return s.error ? init() : wd({ ...s, entry: "0", error: null });
    case "allClear": return init();
    case "back": { if (s.error) return init(); if (s.waiting) return wd({ ...s, entry: "0", waiting: false, expression: "" }); const n = s.entry.length <= 1 ? "0" : s.entry.slice(0, -1); return wd({ ...s, entry: n === "-" ? "0" : n }); }
    case "negate": { if (s.error) return init(); if (s.entry === "0") return s; return wd({ ...s, entry: s.entry.startsWith("-") ? s.entry.slice(1) : "-" + s.entry }); }
    case "percent": { if (s.error) return init(); return wd({ ...s, entry: fmt(Number(s.entry) / 100), waiting: false }); }
    case "recall": return wd({ ...s, entry: fmt(a.value), waiting: false, error: null, expression: "" });
    default: return s;
  }
}
let state = init(), history = [];
const disp = document.getElementById("disp"), exp = document.getElementById("exp"), list = document.getElementById("list"), empty = document.getElementById("empty");
function render() {
  disp.textContent = state.display; disp.dataset.error = state.error ? "true" : "false";
  exp.innerHTML = state.expression ? state.expression.replace(/</g, "&lt;") : "&nbsp;";
  list.replaceChildren(...history.map(it => { const li = document.createElement("li"); const b = document.createElement("button"); b.type = "button"; b.className = "item"; b.title = "点击把结果回填为当前输入"; b.innerHTML = '<span class="e">' + it.expression.replace(/</g, "&lt;") + '</span><span class="r">' + it.result + "</span>"; b.onclick = () => { state = reduce(state, { type: "recall", value: Number(it.result) }); render(); }; li.append(b); return li; }));
  empty.hidden = history.length > 0;
}
function press(a) { state = reduce(state, a); if (state.committed) { history = [{ expression: state.committed, result: Number(state.entry) }, ...history].slice(0, MAX_HISTORY); state = { ...state, committed: null }; } render(); }
document.querySelector(".keys").addEventListener("click", ev => { const b = ev.target.closest("button[data-a]"); if (!b) return; const a = { type: b.dataset.a }; if (b.dataset.v !== undefined) a.value = b.dataset.v; press(a); });
window.addEventListener("keydown", ev => {
  const k = ev.key; let a = null;
  if (/^[0-9]$/.test(k)) a = { type: "digit", value: k };
  else if (k === ".") a = { type: "dot" };
  else if (k === "+" || k === "-") a = { type: "op", value: k };
  else if (k === "*" || k === "x" || k === "X") a = { type: "op", value: "×" };
  else if (k === "/") a = { type: "op", value: "÷" };
  else if (k === "Enter" || k === "=") a = { type: "equals" };
  else if (k === "Backspace") a = { type: "back" };
  else if (k === "Escape" || k === "c" || k === "C") a = { type: "allClear" };
  else if (k === "%") a = { type: "percent" };
  if (!a) return; ev.preventDefault(); press(a);
});
document.getElementById("clear").onclick = () => { history = []; render(); };
render();
</script>
</body>
</html>
